            <Field label="مخزون فرع — لو سبتها مركزي هتكون متاحة للتوزيع على الفروع من هنا">
              <select className={inputCls} value={branchId} onChange={set("branchId")}>
                <option value="">مركزي (غير مربوط بفرع)</option>
                {db.branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </Field>
          )}
          <div className="grid grid-cols-3 gap-3">
            <Field label="الوحدة"><input className={inputCls} value={f.unit || ""} onChange={set("unit")} /></Field>
            <Field label="الكمية"><input type="number" className={inputCls} value={f.qty || ""} onChange={set("qty")} /></Field>
            <Field label="الحد الأدنى"><input type="number" className={inputCls} value={f.min || ""} onChange={set("min")} /></Field>
          </div>
          <Field label="تكلفة الوحدة (ج.م) — لحساب تكلفة الخدمات"><input type="number" step="0.01" className={inputCls} value={f.cost || ""} onChange={set("cost")} /></Field>
          <Field label="نوع الصنف">
            <select className={inputCls} value={f.itemType || "consumable"} onChange={set("itemType")}>
              <option value="consumable">مستهلك (بيتحسب في تكلفة الخدمات)</option>
              <option value="equipment">معدة / أداة (مش بيتستهلك لكل حالة)</option>
            </select>
          </Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.inventory.find((y) => y.id === edit.id);
                x.name = f.name; x.unit = f.unit || "وحدة"; x.qty = Number(f.qty || 0); x.min = Number(f.min || 0); x.cost = Number(f.cost || 0); x.itemType = f.itemType || "consumable"; x.specialtyId = specialtyId || ""; x.branchId = branchId || "";
                recomputeAutoPricedServices(d);
              } else {
                d.inventory.push({ id: uid(), name: f.name, unit: f.unit || "وحدة", qty: Number(f.qty || 0), min: Number(f.min || 0), cost: Number(f.cost || 0), itemType: f.itemType || "consumable", specialtyId: specialtyId || "", branchId: branchId || "" });
              }
              return d;
            }, edit ? `تعديل صنف: ${f.name}` : `إضافة صنف للمخزن: ${f.name}`);
            close();
          }}>حفظ الصنف</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "stockTransfer") {
    const centralItems = db.inventory.filter((i) => !i.branchId);
    const itemId = f.itemId || "";
    const item = db.inventory.find((i) => i.id === itemId);
    const n = Math.max(1, Number(f.qty) || 1);
    const toBranchId = f.toBranchId || "";
    return (
      <Modal title="نقل مخزون بين الفروع" onClose={close}>
        <div className="space-y-3">
          <Field label="الصنف (من المخزون المركزي)">
            <select className={inputCls} value={itemId} onChange={set("itemId")}>
              <option value="">— اختر —</option>
              {centralItems.map((i) => <option key={i.id} value={i.id}>{i.name} — متاح {i.qty} {i.unit}</option>)}
            </select>
          </Field>
          {item && (
            <>
              <Field label={`الكمية (المتاح: ${item.qty} ${item.unit})`}>
                <input type="number" min="1" max={item.qty} className={inputCls} value={f.qty ?? 1} onChange={set("qty")} />
              </Field>
              <Field label="إلى فرع">
                <select className={inputCls} value={toBranchId} onChange={set("toBranchId")}>
                  <option value="">— اختر —</option>
                  {db.branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </Field>
            </>
          )}
          <Btn className="w-full" onClick={() => {
            if (!item || !toBranchId || n > item.qty) { alert("راجع الصنف والكمية والفرع المطلوب"); return; }
            const branchName = db.branches.find((b) => b.id === toBranchId)?.name || "";
            update((d) => {
              const src = d.inventory.find((x) => x.id === item.id);
              src.qty = Math.max(0, src.qty - n);
              const existing = d.inventory.find((x) => x.branchId === toBranchId && x.name.trim() === item.name.trim());
              if (existing) existing.qty += n;
              else d.inventory.push({ id: uid(), name: item.name, unit: item.unit, qty: n, min: item.min, cost: item.cost, itemType: item.itemType, specialtyId: item.specialtyId, branchId: toBranchId });
              return d;
            }, `نقل ${n} ${item.unit} من "${item.name}" (مركزي) إلى فرع ${branchName}`);
            close();
          }}>تأكيد النقل</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "doctor") {
    return (
      <Modal title={edit ? "تعديل بيانات الطبيب" : "إضافة طبيب (حساب منفصل)"} onClose={close}>
        <div className="space-y-3">
          <Field label="الاسم"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <Field label="التخصص">
            <select className={inputCls} value={f.specialtyId || ""} onChange={(e) => {
              const sp = db.specialties.find((s) => s.id === e.target.value);
              setF({ ...f, specialtyId: e.target.value, specialty: sp ? sp.name : "" });
            }}>
              <option value="">— اختر تخصص —</option>
              {db.specialties.filter((s) => s.active).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {db.specialties.length === 0 && <p className="text-[11px] text-amber-600 mt-1">لا توجد تخصصات بعد — أضفها من "الحسابات" أولاً.</p>}
          </Field>
          <Field label="نسبة الطبيب (%)"><input type="number" className={inputCls} value={f.commission || ""} onChange={set("commission")} /></Field>
          <Field label="إيميل الطبيب (هيسجل بيه دخوله)"><input dir="ltr" type="email" className={inputCls} placeholder="doctor@example.com" value={f.email || ""} onChange={set("email")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.doctors.find((y) => y.id === edit.id);
                x.name = f.name; x.specialty = f.specialty || ""; x.specialtyId = f.specialtyId || ""; x.commission = Number(f.commission || 0); x.email = f.email || x.email;
              } else {
                d.doctors.push({ id: uid(), name: f.name, specialty: f.specialty || "", specialtyId: f.specialtyId || "", commission: Number(f.commission || 0), email: f.email || "" });
              }
              return d;
            }, edit ? `تعديل بيانات الطبيب: ${f.name}` : `إنشاء حساب طبيب: ${f.name}`);
            close();
          }}>{edit ? "حفظ التعديلات" : "إنشاء الحساب"}</Btn>
        </div>
      </Modal>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
