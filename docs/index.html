/* ---------- مكافآت وخصومات الموظفين (لموظف مُفوَّض من المالك — بدون رؤية كامل بيانات الموظفين) ---------- */
function PayrollActions({ db, update, setModal, h }) {
  const netOf = (e) => {
    const tx = db.payrollTx.filter((x) => x.empId === e.id && !x.settled);
    const bonus = tx.filter((x) => x.type === "مكافأة").reduce((s, x) => s + x.amount, 0);
    const cuts = tx.filter((x) => x.type !== "مكافأة").reduce((s, x) => s + x.amount, 0);
    return { tx, bonus, cuts, net: e.salary + bonus - cuts };
  };
  return (
    <>
      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-1">💰 مكافآت وخصومات الموظفين</h2>
        <p className="text-xs text-slate-500">صلاحية منحك إياها صاحب العيادة — لتسجيل مكافأة أو خصم أو سلفة لأي موظف مع توضيح السبب.</p>
      </Card>
      <div className="space-y-3">
        {db.employees.map((e) => {
          const { tx, bonus, cuts, net } = netOf(e);
          return (
            <Card key={e.id} className="p-4">
              <div className="flex items-center justify-between">
                <p className="font-semibold">{e.name} <span className="text-xs text-slate-500">· {e.role}</span></p>
                <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "payrollTx", data: e })}>+ مكافأة / خصم / سلفة</Btn>
              </div>
              <div className="bg-slate-50 rounded-xl p-3 mt-3">
                <div className="flex flex-wrap gap-2 text-xs">
                  {bonus > 0 && <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-1">مكافآت: +{fmt(bonus)}</span>}
                  {cuts > 0 && <span className="bg-rose-50 text-rose-700 rounded-lg px-2 py-1">خصم/سلف: −{fmt(cuts)}</span>}
                  {bonus === 0 && cuts === 0 && <span className="text-slate-400">لا توجد حركات غير مسواة حاليًا</span>}
                </div>
                {tx.length > 0 && (
                  <div className="mt-2 space-y-1">
                    {tx.map((x) => (
                      <p key={x.id} className="text-[11px] text-slate-500">• {x.type} {fmt(x.amount)} — {x.date} {x.note && `(${x.note})`}</p>
                    ))}
                  </div>
                )}
              </div>
            </Card>
          );
        })}
        {db.employees.length === 0 && <Card className="p-4"><Empty text="لا يوجد موظفون بعد" /></Card>}
      </div>
    </>
  );
}

/* ---------- المخزن ---------- */
function Inventory({ db, update, setModal, audit, h, fixedBranchId }) {
  const [spec, setSpec] = useState("");
  const [branchFilter, setBranchFilter] = useState("");
  const adjust = (i, delta) => setModal({ type: "stockMove", data: { item: i, delta } });
  const specName = (id) => db.specialties.find((s) => s.id === id)?.name;
  const branchName = (id) => db.branches.find((b) => b.id === id)?.name;
  const byBranch = (i) => {
    if (fixedBranchId) return i.branchId === fixedBranchId;
    if (branchFilter === "__central") return !i.branchId;
    if (branchFilter) return i.branchId === branchFilter;
    return true;
  };
  const bySpec = (i) => (spec === "__general" ? !i.specialtyId : !spec || i.specialtyId === spec);
  const scoped = db.inventory.filter((i) => bySpec(i) && byBranch(i));
  return (
    <>
      <div className="flex justify-between items-center">
        <h2 className="font-display font-bold text-brand-900">الخامات والمستهلكات</h2>
        <div className="flex gap-1.5">
          {h.isOwner && !fixedBranchId && db.branches.length > 0 && (
            <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "stockTransfer" })}>↔ نقل بين الفروع</Btn>
          )}
          <Btn size="sm" onClick={() => setModal({ type: "item", data: { specialtyId: spec === "__general" ? "" : spec, branchId: fixedBranchId || (branchFilter === "__central" ? "" : branchFilter) } })}>+ صنف</Btn>
        </div>
      </div>
      {!fixedBranchId && db.branches.length > 0 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setBranchFilter("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${branchFilter === "" ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>كل الفروع</button>
          <button onClick={() => setBranchFilter("__central")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${branchFilter === "__central" ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>مركزي</button>
          {db.branches.map((b) => (
            <button key={b.id} onClick={() => setBranchFilter(b.id)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${branchFilter === b.id ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>🏢 {b.name}</button>
          ))}
        </div>
      )}
      {db.specialties.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setSpec("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === "" ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>الكل</button>
          {db.specialties.filter((s) => s.active).map((s) => (
            <button key={s.id} onClick={() => setSpec(s.id)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === s.id ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{s.name}</button>
          ))}
          <button onClick={() => setSpec("__general")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === "__general" ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>عام / مشترك</button>
        </div>
      )}
      <div className="space-y-2">
        {scoped.length === 0 ? <Card className="p-3"><Empty text="لا توجد أصناف في هذا التصنيف" /></Card> : null}
        {scoped.map((i) => {
          const low = i.qty <= i.min;
          return (
            <Card key={i.id} className={`p-4 flex items-center gap-3 ${low ? "border-rose-200 bg-rose-50/50" : ""}`}>
              <div className="flex-1">
                <p className="font-semibold">{i.name} {low && <span className="text-xs text-rose-600 font-bold">⚠️</span>}
                  {i.specialtyId ? <span className="text-[10px] bg-brand-50 text-brand-700 rounded-full px-2 py-0.5 mr-1">{specName(i.specialtyId) || "—"}</span>
                    : <span className="text-[10px] bg-slate-100 text-slate-500 rounded-full px-2 py-0.5 mr-1">عام</span>}
                  {!fixedBranchId && db.branches.length > 0 && (i.branchId
                    ? <span className="text-[10px] bg-violet-50 text-violet-700 rounded-full px-2 py-0.5 mr-1">🏢 {branchName(i.branchId) || "—"}</span>
                    : <span className="text-[10px] bg-slate-100 text-slate-500 rounded-full px-2 py-0.5 mr-1">مركزي</span>)}</p>
                <p className="text-xs text-slate-500">الحد الأدنى: {i.min} {i.unit}{h.isOwner && i.cost > 0 && ` · تكلفة الوحدة: ${fmt(i.cost)}`}</p>
              </div>
              <div className="flex items-center gap-2">
                <Btn size="sm" tone="ghost" onClick={() => adjust(i, -1)}>− صرف</Btn>
                <span className="font-bold text-brand-900 min-w-[60px] text-center text-sm">{i.qty} {i.unit}</span>
                <Btn size="sm" tone="ghost" onClick={() => adjust(i, +1)}>+ إضافة</Btn>
              </div>
              <div className="flex flex-col gap-1 shrink-0">
                <button title="تعديل" onClick={() => setModal({ type: "item", data: { edit: i } })} className="text-slate-400 hover:text-brand-700">✏️</button>
                <button title="حذف" onClick={() => setModal({ type: "reason", data: {
                  title: "حذف صنف: " + i.name, area: "المخزن", act: "حذف صنف", item: i.name,
                  before: i.qty + " " + i.unit, after: "محذوف",
                  apply: (d) => { d.inventory = d.inventory.filter((x) => x.id !== i.id); return d; },
                } })} className="text-slate-400 hover:text-rose-600">🗑️</button>
              </div>
            </Card>
          );
        })}
      </div>
    </>
  );
}

/* ---------- الفروع ---------- */
function Branches({ db, h, setModal, openBranch }) {
  const staffAt = (branchId) => db.employees.filter((e) => db.branchAssignments.some((a) => a.branchId === branchId && a.memberId === e.id));
  const doctorsAt = (branchId) => db.doctors.filter((d) => db.branchAssignments.some((a) => a.branchId === branchId && a.memberId === d.id));
  const apptsToday = (branchId) => db.appointments.filter((a) => a.branchId === branchId && a.date === todayStr());
  return (
    <>
      <div className="flex justify-between items-center">
        <h2 className="font-display font-bold text-brand-900">الفروع</h2>
        <Btn size="sm" onClick={() => setModal({ type: "branch" })}>+ فرع</Btn>
      </div>
      {db.branches.length === 0 ? (
        <Card className="p-4"><Empty text="لا توجد فروع بعد — العيادة بتشتغل كموقع واحد. أضف فرعاً لو هتفتح مكان تاني، وهتقدر تتابع كل فرع كأنه حساب منفصل (مخزن وحسابات خاصة بيه)." /></Card>
      ) : (
        <div className="space-y-2.5">
          {db.branches.map((b) => (
            <button key={b.id} onClick={() => openBranch(b.id)}
              className="w-full text-right bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-3 hover:border-brand-300 transition-colors">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: "#F3E2DC", color: "#9C5C4B" }}>
                <TabIcon id="branches" />
              </div>
              <div className="flex-1 min-w-0">
                <p className="font-bold text-sm truncate">{b.name} {b.isHeadOffice && <span className="text-[10px] bg-brand-50 text-brand-700 rounded-full px-2 py-0.5">🏠 رئيسي</span>}
                  {!b.active && <span className="text-[10px] bg-slate-100 text-slate-400 rounded-full px-2 py-0.5">معطّل</span>}</p>
                <p className="text-xs text-slate-500 mt-0.5">{staffAt(b.id).length} موظف · {doctorsAt(b.id).length} طبيب · {apptsToday(b.id).length} موعد اليوم</p>
              </div>
              <span className="text-slate-300">‹</span>
            </button>
          ))}
        </div>
      )}
    </>
  );
}

function BranchDetail({ db, h, branchId, back, update, setModal, audit }) {
  const [section, setSection] = useState(null); // null | 'inv'
  const [expanded, setExpanded] = useState(null); // null | 'staff' | 'doctors' | 'finance'
  const branch = db.branches.find((x) => x.id === branchId);
  const today = todayStr();
  const staff = db.employees.filter((e) => db.branchAssignments.some((a) => a.branchId === branchId && a.memberId === e.id));
  const doctors = db.doctors.filter((d) => db.branchAssignments.some((a) => a.branchId === branchId && a.memberId === d.id));
  const todayAppts = db.appointments.filter((a) => a.branchId === branchId && a.date === today);
  const finToday = branchFinance(db, branchId, today);
  const finMonth = branchFinance(db, branchId, today.slice(0, 7) + "-01");
  const dues = db.appointments.filter((a) => a.branchId === branchId && a.status !== "ملغي").reduce((s, a) => s + Math.max(0, a.price - a.paid), 0);
  const lowStock = db.inventory.filter((i) => i.branchId === branchId && i.qty <= i.min);

  if (!branch) return <Card className="p-4"><Empty text="الفرع ده اتحذف" /></Card>;

  if (section === "inv") {
    return (
      <>
        <button onClick={() => setSection(null)} className="text-sm text-brand-700 font-semibold">→ رجوع لـ {branch.name}</button>
        <Inventory db={db} update={update} setModal={setModal} audit={audit} h={h} fixedBranchId={branchId} />
      </>
    );
  }

  const toggle = (k) => setExpanded(expanded === k ? null : k);
  const tile = (key, iconId, label, sub, tone) => (
    <button onClick={() => (key === "inv" ? setSection("inv") : toggle(key))}
      className={`text-right rounded-2xl p-4 border transition-colors ${expanded === key ? "border-brand-300 bg-brand-50/40" : "bg-white border-slate-200 hover:border-brand-200"}`}>
      <div className="w-9 h-9 rounded-lg flex items-center justify-center mb-2" style={{ background: tone === "rose" ? "#FDEDEA" : tone === "emerald" ? "#E4EEE6" : tone === "violet" ? "#EDE1F0" : "#F3E2DC", color: tone === "rose" ? "#B5502B" : tone === "emerald" ? "#3C7A5E" : tone === "violet" ? "#7A4E93" : "#9C5C4B" }}>
        <TabIcon id={iconId} />
      </div>
      <p className="font-bold text-sm">{label}</p>
      <p className="text-xs text-slate-500 mt-0.5">{sub}</p>
    </button>
  );

  return (
    <>
      <div className="flex items-center gap-2.5">
        <button onClick={back} className="w-8 h-8 rounded-lg flex items-center justify-center bg-white border border-slate-200 text-slate-500 shrink-0">→</button>
        <div className="min-w-0">
          <h2 className="font-display font-bold text-brand-900 truncate">{branch.name} {branch.isHeadOffice && <span className="text-[10px] bg-brand-50 text-brand-700 rounded-full px-2 py-0.5">🏠 رئيسي</span>}</h2>
          <p className="text-xs text-slate-500 truncate">{branch.address || "بدون عنوان"}</p>
        </div>
      </div>

      <Card className="p-4">
        <p className="text-xs font-bold text-brand-700 mb-3">نظرة سريعة — الفرع</p>
        <div className="grid grid-cols-2 gap-3">
          <Stat label="مواعيد اليوم" value={todayAppts.length} />
          <Stat label="تحصيلات اليوم" value={fmt(finToday.revenue)} tone="emerald" />
          <Stat label="مستحقات المرضى" value={fmt(dues)} tone="rose" />
          <Stat label="أصناف تحت الحد الأدنى" value={lowStock.length} tone={lowStock.length ? "rose" : "teal"} />
        </div>
      </Card>

      <div>
        <p className="text-xs font-bold text-slate-500 mb-2">أقسام الفرع</p>
        <div className="grid grid-cols-2 gap-2.5">
          {tile("staff", "staff", "الموظفون", `${staff.length} موظف`)}
          {tile("doctors", "doctors", "الأطباء", doctors.length ? `${doctors.length} طبيب` : "لا يوجد", "emerald")}
          {tile("inv", "inv", "المخزن", `${lowStock.length} صنف تحت الحد الأدنى`, lowStock.length ? "rose" : undefined)}
          {tile("finance", "finance", "الحسابات", `صافي الشهر ${fmt(finMonth.net)}`, "violet")}
        </div>
      </div>

      {expanded === "staff" && (
        <Card className="p-4">
          <p className="text-sm font-bold mb-2">موظفو {branch.name}</p>
          {staff.length === 0 ? <Empty text="لا يوجد موظفون معيّنون على الفرع ده — عيّنهم من الحسابات ← الموظفون" /> : (
            <div className="space-y-1.5">{staff.map((e) => <p key={e.id} className="text-sm">👤 {e.name} <span className="text-xs text-slate-400">— {e.role}</span></p>)}</div>
          )}
        </Card>
      )}
      {expanded === "doctors" && (
        <Card className="p-4">
          <p className="text-sm font-bold mb-2">أطباء {branch.name}</p>
          {doctors.length === 0 ? <Empty text="لا يوجد أطباء معيّنون على الفرع ده" /> : (
            <div className="space-y-1.5">{doctors.map((d) => <p key={d.id} className="text-sm">🩺 {d.name} <span className="text-xs text-slate-400">— {d.specialty}</span></p>)}</div>
          )}
        </Card>
      )}
      {expanded === "finance" && (
        <Card className="p-4">
          <p className="text-sm font-bold mb-3">حسابات {branch.name}</p>
          <div className="grid grid-cols-3 gap-2 mb-3">
            <Stat label="تحصيلات الشهر" value={fmt(finMonth.revenue)} tone="emerald" />
            <Stat label="مصاريف الشهر" value={fmt(finMonth.expenses)} tone="rose" />
            <Stat label="الصافي" value={fmt(finMonth.net)} tone={finMonth.net >= 0 ? "emerald" : "rose"} />
          </div>
          <p className="text-[11px] text-slate-400">المصاريف "العامة" (غير مربوطة بفرع) بتظهر في حسابات العيادة الكلية فقط، مش هنا.</p>
        </Card>
      )}
    </>
  );
}

/* ---------- المساعد الذكي ---------- */
function AiAssistant({ db, h, setModal }) {
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [result, setResult] = useState(null);
  const [usedIdx, setUsedIdx] = useState({});
  const [usage, setUsage] = useState(null);

  const canPatients = h.isOwner || h.can("patients") || (!h.isOwner && !h.isStaff);
  const canAppts = h.isOwner || h.can("appts") || (!h.isOwner && !h.isStaff);
  const canExpense = h.isOwner;
  const canPayment = h.isOwner || h.can("collect") || (!h.isOwner && !h.isStaff);
  const canEncounter = h.isOwner || (!h.isOwner && !h.isStaff) || h.can("patients");

  const run = async () => {
    if (!note.trim()) return;
    setBusy(true); setErr(""); setResult(null); setUsedIdx({});
    try {
      const context = {
        today: todayStr(),
        patients: db.patients.map((p) => ({ id: p.id, name: p.name })),
        doctors: db.doctors.map((d) => ({ id: d.id, name: d.name })),
        services: db.services.filter((s) => s.active).map((s) => ({ id: s.id, name: s.name, price: s.price })),
      };
      const res = await callAiAssistant(note.trim(), context);
      setResult(res);
      if (res.usage) setUsage(res.usage);
    } catch (e) {
      setErr(e.message || String(e));
      if (e.usage) setUsage(e.usage);
    } finally { setBusy(false); }
  };

  const markUsed = (i) => setUsedIdx((u) => ({ ...u, [i]: true }));
  const openFor = (i, a) => {
    markUsed(i);
    if (a.type === "new_patient") {
      setModal({ type: "patient", data: { prefill: { name: a.name, phone: a.phone || "", gender: a.gender || "", age: a.age || "" } } });
    } else if (a.type === "new_appointment") {
      setModal({ type: "appt", data: { prefill: {
        patientId: a.patientId || "", doctorId: a.doctorId || (h.isOwner ? "" : h.myDocId),
        date: a.date || todayStr(), time: a.time || "", service: a.service || "", price: a.price ?? "",
      } } });
    } else if (a.type === "expense") {
      setModal({ type: "expense", data: { prefill: { item: a.item, category: a.category || "", amount: a.amount ?? "" } } });
    } else if (a.type === "encounter_note") {
      setModal({ type: "encounter", data: { patientId: a.patientId, prefill: {
        chiefComplaint: a.chiefComplaint || "", examination: a.examination || "", assessment: a.assessment || "", plan: a.plan || "",
      } } });
    }
  };

  const dueAppointmentsFor = (patientId) => db.appointments.filter((x) => x.patientId === patientId && x.status !== "ملغي" && ((x.patientShare ?? x.price) - x.paid) > 0);

  return (
    <>
      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-1">✨ المساعد الذكي</h2>
        <p className="text-xs text-slate-500 mb-3">اكتب ملاحظة بأي صيغة — زيارة، تحصيلة، مصروف، مريض جديد — والمساعد هيجهزها كمسودة تراجعها وتأكدها بنفسك قبل الحفظ. المساعد لا يسجل أي حاجة تلقائيًا في القاعدة.</p>
        <textarea rows="4" className={inputCls} placeholder="مثال: أحمد محمود جه النهارده عند دكتور سارة عمل حشو وسدد ٢٠٠ كاش"
          value={note} onChange={(e) => setNote(e.target.value)} />
        <Btn className="w-full mt-3" onClick={run} disabled={busy || !note.trim()}>{busy ? "بيفكر…" : "✨ حلل الملاحظة"}</Btn>
        {err && <p className="text-xs text-rose-600 mt-2">{err}</p>}
        {usage && (
          <p className={`text-[11px] mt-2 ${usage.callCount >= usage.monthlyCap ? "text-rose-600 font-semibold" : "text-slate-400"}`}>
            استخدام المساعد هذا الشهر: {usage.callCount} من {usage.monthlyCap}
          </p>
        )}
      </Card>

      {result && result.clarify && (
        <Card className="p-4 border border-amber-200 bg-amber-50">
          <p className="text-sm text-amber-800">🤔 {result.clarify}</p>
        </Card>
      )}

      {result && result.actions.length > 0 && (
        <div className="space-y-2">
          {result.actions.map((a, i) => {
            const used = !!usedIdx[i];
            if (a.type === "new_patient") return (
              <Card key={i} className={`p-4 ${used ? "opacity-50" : ""}`}>
                <p className="text-xs font-bold text-brand-700 mb-1">مريض جديد</p>
                <p className="text-sm font-semibold">{a.name}</p>
                <p className="text-xs text-slate-500">{[a.phone, a.gender, a.age && `${a.age} سنة`].filter(Boolean).join(" · ") || "بدون تفاصيل إضافية"}</p>
                {canPatients ? <Btn size="sm" className="mt-2" onClick={() => openFor(i, a)} disabled={used}>{used ? "اتفتح" : "استخدم واملأ النموذج"}</Btn>
                  : <p className="text-xs text-rose-600 mt-2">مفيش صلاحية إضافة مريض</p>}
              </Card>
            );
            if (a.type === "new_appointment") return (
              <Card key={i} className={`p-4 ${used ? "opacity-50" : ""}`}>
                <p className="text-xs font-bold text-brand-700 mb-1">حجز موعد</p>
                <p className="text-sm font-semibold">{a.patientName}{a.patientId ? "" : " (مش متعرف عليه — هتختاره يدوي)"}</p>
                <p className="text-xs text-slate-500">{[a.doctorName, a.date, a.time, a.service, a.price != null && fmt(a.price)].filter(Boolean).join(" · ") || "التفاصيل غير مكتملة"}</p>
                {canAppts ? <Btn size="sm" className="mt-2" onClick={() => openFor(i, a)} disabled={used}>{used ? "اتفتح" : "استخدم واملأ النموذج"}</Btn>
                  : <p className="text-xs text-rose-600 mt-2">مفيش صلاحية حجز مواعيد</p>}
              </Card>
            );
            if (a.type === "expense") return (
              <Card key={i} className={`p-4 ${used ? "opacity-50" : ""}`}>
                <p className="text-xs font-bold text-rose-700 mb-1">مصروف</p>
                <p className="text-sm font-semibold">{a.item}</p>
                <p className="text-xs text-slate-500">{[a.category, a.amount != null && fmt(a.amount)].filter(Boolean).join(" · ")}</p>
                {canExpense ? <Btn size="sm" className="mt-2" onClick={() => openFor(i, a)} disabled={used}>{used ? "اتفتح" : "استخدم واملأ النموذج"}</Btn>
                  : <p className="text-xs text-rose-600 mt-2">المصروفات لصاحب العيادة بس</p>}
              </Card>
            );
            if (a.type === "payment") {
              const due = a.patientId ? dueAppointmentsFor(a.patientId) : [];
              return (
                <Card key={i} className={`p-4 ${used ? "opacity-50" : ""}`}>
                  <p className="text-xs font-bold text-emerald-700 mb-1">تحصيلة</p>
                  <p className="text-sm font-semibold">{a.patientName}{a.patientId ? "" : " (مش متعرف عليه)"}</p>
                  <p className="text-xs text-slate-500">{[a.amount != null && fmt(a.amount), a.method].filter(Boolean).join(" · ")}</p>
                  {!canPayment ? <p className="text-xs text-rose-600 mt-2">مفيش صلاحية تحصيل</p>
                    : !a.patientId ? <p className="text-xs text-slate-400 mt-2">دوّر على المريض من شاشة المرضى وسجّل التحصيلة من هناك</p>
                    : due.length === 0 ? <p className="text-xs text-slate-400 mt-2">مفيش مواعيد عليها مستحقات لهذا المريض</p>
                    : (
                      <div className="space-y-1.5 mt-2">
                        {due.map((appt) => (
                          <button key={appt.id} onClick={() => { markUsed(i); setModal({ type: "collect", data: appt }); }}
                            className="w-full text-right bg-emerald-50 hover:bg-emerald-100 rounded-xl p-2 text-xs">
                            {appt.date} · {appt.service} — متبقي {fmt((appt.patientShare ?? appt.price) - appt.paid)}
                          </button>
                        ))}
                      </div>
                    )}
                </Card>
              );
            }
            if (a.type === "encounter_note") return (
              <Card key={i} className={`p-4 ${used ? "opacity-50" : ""}`}>
                <p className="text-xs font-bold text-sky-700 mb-1">زيارة / شيت طبي</p>
                <p className="text-sm font-semibold">{a.patientName}{a.patientId ? "" : " (مش متعرف عليه — لازم يكون مريض مسجل)"}</p>
                <p className="text-xs text-slate-500">{[a.chiefComplaint, a.plan].filter(Boolean).join(" — ") || "بدون تفاصيل"}</p>
                {!canEncounter ? <p className="text-xs text-rose-600 mt-2">مفيش صلاحية تسجيل زيارة</p>
                  : !a.patientId ? <p className="text-xs text-slate-400 mt-2">لازم تحدد المريض من شاشة المرضى الأول</p>
                  : <Btn size="sm" className="mt-2" onClick={() => openFor(i, a)} disabled={used}>{used ? "اتفتح" : "استخدم واملأ النموذج"}</Btn>}
              </Card>
            );
            return null;
          })}
        </div>
      )}
    </>
  );
}

/* عرض وتعديل سقف الاستخدام الشهري للمساعد الذكي — بيانات منفصلة عن db الرئيسية، بتتحمّل مباشرة */
function AiUsageCard() {
  const [usage, setUsage] = useState(null);
  const [cap, setCap] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  useEffect(() => {
    sb.from("ai_usage").select("*").limit(1).then(({ data }) => {
      if (data && data[0]) { setUsage(data[0]); setCap(String(data[0].monthly_cap)); }
      else { setCap("300"); }
    });
  }, []);

  const save = async () => {
    const n = Number(cap);
    if (!n || n < 1) { setMsg("لازم رقم صحيح أكبر من صفر"); return; }
    setBusy(true); setMsg("");
    try {
      const { error } = await sb.rpc("set_ai_usage_cap", { p_cap: n });
      if (error) throw error;
      setUsage((u) => ({ ...(u || { call_count: 0 }), monthly_cap: n }));
      setMsg("✅ اتحفظ");
    } catch (e) {
      setMsg("خطأ: " + (e.message || e));
    } finally { setBusy(false); }
  };

  return (
    <Card className="p-4">
      <h2 className="font-display font-bold text-brand-900 mb-2">✨ استهلاك المساعد الذكي</h2>
      <p className="text-xs text-slate-500 mb-3">كل استخدام للمساعد الذكي بيكلّف فلوس فعلية (اشتراك Anthropic). السقف الشهري بيمنع أي استخدام زيادة عن الرقم ده تلقائيًا، لحد ما الشهر الجديد يبدأ.</p>
      {usage && (
        <p className="text-sm mb-3">الاستخدام هذا الشهر: <b className={usage.call_count >= usage.monthly_cap ? "text-rose-600" : "text-brand-800"}>{usage.call_count}</b> من {usage.monthly_cap}</p>
      )}
      <Field label="السقف الشهري">
        <div className="flex gap-2">
          <input type="number" min="1" className={inputCls} value={cap} onChange={(e) => setCap(e.target.value)} />
          <Btn size="sm" onClick={save} disabled={busy}>{busy ? "…" : "حفظ"}</Btn>
        </div>
      </Field>
      {msg && <p className="text-xs mt-1 text-emerald-600">{msg}</p>}
    </Card>
  );
}

  const close = () => setModal(null);
  return (
    <Modal title={d.title} onClose={close}>

        <Field label="سبب التعديل / الحذف (إجباري)">

/* ---------- حركة مخزن بسبب ---------- */
function StockMoveModal({ modal, setModal, audit, db }) {
  const { item, delta } = modal.data;
  const isOut = delta < 0;
  const [qty, setQty] = useState(1);
  const [reason, setReason] = useState("");
  const [supplierId, setSupplierId] = useState("");
  const [unitCost, setUnitCost] = useState(item.cost || "");
  const [logExpense, setLogExpense] = useState(true);
  const [paidNow, setPaidNow] = useState(true);
  const [busy, setBusy] = useState(false);
  const close = () => setModal(null);
  const n = Math.max(1, Number(qty) || 1);
  const newQty = Math.max(0, item.qty + (isOut ? -n : n));
  const cost = Number(unitCost) || 0;
  const purchaseTotal = n * cost;
  return (
    <Modal title={(isOut ? "صرف من" : "إضافة إلى") + " " + item.name} onClose={close}>
      <div className="space-y-3">
        <p className="text-sm text-slate-600">الرصيد الحالي: <b>{item.qty} {item.unit}</b> ← بعد الحركة: <b className={isOut ? "text-rose-700" : "text-emerald-700"}>{newQty} {item.unit}</b></p>
        <Field label={"الكمية (" + item.unit + ")"}>
          <input type="number" min="1" className={inputCls} value={qty} onChange={(e) => setQty(e.target.value)} />
        </Field>
        {!isOut && (
          <>
            <Field label={"المورد (اختياري)" + (item.specialtyId ? " — موردو تخصص " + (db.specialties.find((s) => s.id === item.specialtyId)?.name || "") + " ظاهرين أولاً" : "")}>
              <select className={inputCls} value={supplierId} onChange={(e) => setSupplierId(e.target.value)}>
                <option value="">— بدون تحديد —</option>
                {db.suppliers.filter((s) => s.active && s.specialtyId === item.specialtyId).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                {db.suppliers.filter((s) => s.active && s.specialtyId !== item.specialtyId).length > 0 && (
                  <optgroup label="موردون آخرون">
                    {db.suppliers.filter((s) => s.active && s.specialtyId !== item.specialtyId).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </optgroup>
                )}
              </select>
            </Field>
            <Field label={"تكلفة الوحدة (ج.م) — بتتحدث بيها تكلفة الصنف"}>
              <input type="number" step="0.01" className={inputCls} value={unitCost} onChange={(e) => setUnitCost(e.target.value)} />
            </Field>
            {cost > 0 && supplierId && (
              <div className="space-y-1.5">
                <label className="flex items-center gap-2 text-xs bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 cursor-pointer">
                  <input type="radio" name="paystatus" checked={paidNow} onChange={() => setPaidNow(true)} />
                  <span>مدفوع الآن نقدًا — يتسجل {fmt(purchaseTotal)} كمصروف "مخزن" فورًا</span>
                </label>
                <label className="flex items-center gap-2 text-xs bg-amber-50 border border-amber-200 rounded-xl p-2.5 cursor-pointer">
                  <input type="radio" name="paystatus" checked={!paidNow} onChange={() => setPaidNow(false)} />
                  <span>على الحساب (دين على العيادة) — هيتسجل كمصروف وقت السداد فعليًا من كشف حساب المورد</span>
                </label>
              </div>
            )}
            {cost > 0 && !supplierId && (
              <label className="flex items-center gap-2 text-xs bg-slate-50 rounded-xl p-2.5 cursor-pointer">
                <input type="checkbox" checked={logExpense} onChange={(e) => setLogExpense(e.target.checked)} />
                <span>سجّل {fmt(purchaseTotal)} تلقائيًا كمصروف "مخزن"</span>
              </label>
            )}
          </>
        )}
        <Field label={isOut ? "سبب الصرف (إجباري)" : "مصدر الإضافة (إجباري)"}>
          <input className={inputCls} placeholder={isOut ? "استخدام في حالة، تلف، مرتجع…" : "شراء من مورد، مرتجع…"} value={reason} onChange={(e) => setReason(e.target.value)} />
        </Field>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[11px] text-amber-800">
          🚨 كل حركة مخزن تُسجَّل في تقرير الرقابة باسمك.
        </div>
        <Btn className="w-full" tone={isOut ? "rose" : "emerald"} disabled={busy} onClick={async () => {
          if (reason.trim().length < 3) { alert("لازم تكتب السبب"); return; }
          const supplierName = db.suppliers.find((s) => s.id === supplierId)?.name;
          setBusy(true);
          let confirmedQty;
          try {
            // زيادة/نقصان ذري على السيرفر عشان لو حد تاني عدّل نفس الصنف في نفس اللحظة، مفيش حركة تضيع
            const { data, error } = await sb.rpc("adjust_inventory_qty", { p_item_id: item.id, p_delta: isOut ? -n : n });
            if (error) throw error;
            confirmedQty = data;
          } catch (e) {
            alert("⚠️ تعذر تسجيل حركة المخزن — تأكد من الاتصال بالإنترنت وحاول تاني.\n" + (e.message || e));
            setBusy(false);
            return;
          }
          audit((d) => {
            const x = d.inventory.find((y) => y.id === item.id);
            x.qty = confirmedQty;
            if (!isOut && cost > 0) {
              x.cost = cost;
              if (supplierId) {
                const invId = uid();
                d.purchaseInvoices.push({ id: invId, supplierId, date: todayStr(), total: purchaseTotal, paidAmount: paidNow ? purchaseTotal : 0, notes: `${item.name} × ${n}` });
                if (paidNow) {
                  d.supplierPayments.push({ id: uid(), supplierId, invoiceId: invId, amount: purchaseTotal, date: todayStr(), notes: "" });
                  d.expenses.push({ id: uid(), date: todayStr(), item: `شراء ${item.name} من ${supplierName}`, category: "مخزن", amount: purchaseTotal, branchId: item.branchId });
                }
              } else if (logExpense) {
                d.expenses.push({
                  id: uid(), date: todayStr(),
                  item: `شراء ${item.name}`,
                  category: "مخزن", amount: purchaseTotal, branchId: item.branchId,
                });
              }
              recomputeAutoPricedServices(d);
            }
            return d;
          }, { area: "المخزن", act: isOut ? "صرف كمية" : "إضافة كمية", item: item.name,
              before: item.qty + " " + item.unit, after: confirmedQty + " " + item.unit, reason: reason.trim() });
          close();
        }}>{busy ? "جارِ التسجيل…" : "تأكيد"}</Btn>
      </div>
    </Modal>
  );
}

function Watchtower({ db }) {
  const [area, setArea] = useState("");
  const flags = (db.auditFlags || []).filter((x) => !area || x.area === area);
  const areas = [...new Set((db.auditFlags || []).map((x) => x.area))];
  const byUser = {};
  (db.auditFlags || []).forEach((x) => { byUser[x.user] = (byUser[x.user] || 0) + 1; });
  const tone = (a) => a.indexOf("حذف") === 0 ? "bg-rose-50 border-rose-200" : a.indexOf("تعديل") === 0 ? "bg-amber-50 border-amber-200" : "bg-slate-50 border-slate-200";
  return (
    <React.Fragment>
      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-1">🚨 تقرير الرقابة</h2>
        <p className="text-xs text-slate-500 mb-3">كل تعديل أو حذف في الأسعار أو المخزن أو الماليات — باسم منفّذه وسببه. يراه صاحب العيادة فقط.</p>
        <div className="grid grid-cols-2 gap-2">
          {Object.entries(byUser).map(([u, c]) => (
            <div key={u} className="bg-slate-50 rounded-xl p-2.5 text-xs">
              <p className="font-semibold truncate">{u}</p>
              <p className="text-slate-500">{c} عملية</p>
            </div>
          ))}
          {Object.keys(byUser).length === 0 && <p className="text-xs text-slate-400 col-span-2 text-center py-2">لا توجد عمليات مسجلة بعد</p>}
        </div>
      </Card>

      {areas.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setArea("")} className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${area === "" ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>الكل</button>
          {areas.map((a) => (
            <button key={a} onClick={() => setArea(a)} className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${area === a ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{a}</button>
          ))}
        </div>
      )}

      <Card className="p-4">
        {flags.length === 0 ? <Empty text="لا توجد عمليات مسجلة" /> : (
          <div className="space-y-2">
            {flags.map((x) => (
              <div key={x.id} className={`rounded-xl border p-3 ${tone(x.act)}`}>
                <div className="flex justify-between items-start gap-2">
                  <div className="min-w-0">
                    <p className="font-bold text-sm">{x.act} — {x.item}</p>
                    <p className="text-xs text-slate-600 mt-0.5">
                      {x.before && <span>من <b>{x.before}</b> </span>}
                      {x.after && <span>إلى <b>{x.after}</b></span>}
                    </p>
                    <p className="text-xs text-slate-700 mt-1 bg-white/70 rounded-lg px-2 py-1">📝 السبب: {x.reason || "—"}</p>
                  </div>
                  <div className="text-left shrink-0">
                    <p className="text-[10px] text-slate-400">{x.date}</p>
                    <p className="text-[10px] text-slate-400">{x.time}</p>
                  </div>
                </div>
                <p className="text-[11px] font-semibold text-brand-800 mt-1.5">👤 {x.user} · {x.area}</p>
              </div>
            ))}
          </div>
        )}
      </Card>
    </React.Fragment>
  );
}

/* ---------- حضوري (للموظف) ---------- */
function MyAttendance({ db, h, update }) {
  const t = todayStr();
  const e = h.myEmp;
  const [busy, setBusy] = useState(false);
  if (!e) return null;
  const r = db.attendance.find((x) => x.empId === e.id && x.date === t);
  const log = db.attendance.filter((x) => x.empId === e.id).slice(-15).reverse();
  const branch = primaryBranchOf(db, e.id);

  const methodBadge = (method, distance) => method === "gps"
    ? <span className="text-[10px] bg-emerald-50 text-emerald-700 rounded-full px-1.5 py-0.5">📍 موقع مؤكد{distance != null ? ` (${Math.round(distance)}م)` : ""}</span>
    : method === "manual"
      ? <span className="text-[10px] bg-amber-50 text-amber-700 rounded-full px-1.5 py-0.5">✍️ يدوي</span>
      : null;

  const doCheckIn = async () => {
    setBusy(true);
    try {
      const loc = await verifyAttendanceLocation(branch);
      if (!loc) return;
      update((d) => {
        d.attendance.push({
          id: uid(), empId: e.id, date: t, in: nowTime(), out: null,
          branchId: loc.branchId, inMethod: loc.method, inDistance: loc.distance,
          inLat: loc.lat, inLng: loc.lng, inAccuracy: loc.accuracy,
          manualOverride: !!loc.manualOverride, overrideReason: loc.overrideReason || "",
        });
        return d;
      }, "تسجيل حضور " + e.name + (loc.manualOverride ? " (يدوي: " + loc.overrideReason + ")" : ""));
    } finally { setBusy(false); }
  };

  const doCheckOut = async () => {
    setBusy(true);
    try {
      const loc = await verifyAttendanceLocation(branch);
      if (!loc) return;
      update((d) => {
        const x = d.attendance.find((y) => y.empId === e.id && y.date === t && !y.out);
        if (x) {
          x.out = nowTime(); x.outMethod = loc.method; x.outDistance = loc.distance;
          x.outLat = loc.lat; x.outLng = loc.lng; x.outAccuracy = loc.accuracy;
          if (loc.manualOverride) { x.manualOverride = true; x.overrideReason = (x.overrideReason ? x.overrideReason + " | " : "") + "انصراف: " + loc.overrideReason; }
        }
        return d;
      }, "تسجيل انصراف " + e.name);
    } finally { setBusy(false); }
  };

  return (
    <React.Fragment>
      <Card className="p-4 text-center">
        <p className="font-bold text-brand-900 mb-1">{e.name} — {e.role}</p>
        <p className="text-xs text-slate-500 mb-3">{t}{branch && ` · 🏢 ${branch.name}`}</p>
        {!r ? (
          <Btn tone="emerald" disabled={busy} onClick={doCheckIn}>{busy ? "لحظة… جارِ تحديد الموقع" : "✋ تسجيل حضوري الآن"}</Btn>
        ) : !r.out ? (
          <React.Fragment>
            <p className="text-sm text-emerald-600 mb-2">حضرت الساعة {r.in} {methodBadge(r.inMethod, r.inDistance)}</p>
            <Btn tone="rose" disabled={busy} onClick={doCheckOut}>{busy ? "لحظة… جارِ تحديد الموقع" : "🏃 تسجيل انصرافي"}</Btn>
          </React.Fragment>
        ) : (
          <p className="text-sm text-slate-500">✓ يومك اكتمل: حضور {r.in} — انصراف {r.out}</p>
        )}
        {!branch && <p className="text-[11px] text-slate-400 mt-2">مفيش فرع محدد لحسابك — الحضور هيتسجل يدوي. اطلب من صاحب العيادة يحدد فرعك.</p>}
      </Card>
      <Card className="p-4">
        <h3 className="font-display font-bold text-brand-900 mb-3">سجل حضوري</h3>
        {log.length === 0 ? <Empty text="لا توجد سجلات بعد" /> : (
          <div className="space-y-1.5 text-sm">
            {log.map((x) => (
              <div key={x.id} className="flex justify-between items-center border-b border-slate-100 pb-1.5">
                <span>{x.date}</span>
                <span className="text-xs text-slate-500 flex items-center gap-1">{x.in}{x.out ? " ← " + x.out : " (لم تنصرف)"} {methodBadge(x.inMethod, x.inDistance)}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </React.Fragment>
  );
}

/* ---------- الشيت الطبي: زيارة/كشف بنموذج ديناميكي حسب تخصص الطبيب ---------- */
function EncounterModal({ modal, setModal, db, update, h }) {
  const { patientId } = modal.data;
  const patient = db.patients.find((p) => p.id === patientId);
  const [edit, setEdit] = useState(modal.data.edit || null);
  const pre = modal.data.prefill || {};
  const [doctorId, setDoctorId] = useState(edit?.doctorId || h.myDocId || "");
  const doctor = db.doctors.find((d) => d.id === doctorId);
  const [specialtyId, setSpecialtyId] = useState(edit?.specialtyId || doctor?.specialtyId || "");
  const [chiefComplaint, setChiefComplaint] = useState(edit?.chiefComplaint || pre.chiefComplaint || "");
  const [hpi, setHpi] = useState(edit?.hpi || pre.hpi || "");
  const [examination, setExamination] = useState(edit?.examination || pre.examination || "");
  const [assessment, setAssessment] = useState(edit?.assessment || pre.assessment || "");
  const [plan, setPlan] = useState(edit?.plan || pre.plan || "");
  const [fieldValues, setFieldValues] = useState(() => {
    if (!edit) return {};
    const out = {};
    db.encounterFieldValues.filter((v) => v.encounterId === edit.id).forEach((v) => { out[v.fieldId] = v.value; });
    return out;
  });
  const [diagInput, setDiagInput] = useState("");
  const [procInput, setProcInput] = useState("");
  const [medInput, setMedInput] = useState("");
  const [insInput, setInsInput] = useState("");
  const [docType, setDocType] = useState("تحليل");
  const [uploading, setUploading] = useState(false);
  const [err, setErr] = useState("");
  const close = () => setModal(null);

  if (!patient) return null;
  const template = db.specialtyFormTemplates.find((t) => t.specialtyId === specialtyId && t.active);
  const fields = template ? db.specialtyFormFields.filter((f) => f.templateId === template.id && f.active).sort((a, b) => a.sortOrder - b.sortOrder) : [];
  const sections = [];
  fields.forEach((f) => { if (!sections.some((s) => s.key === f.section)) sections.push({ key: f.section, label: f.sectionLabel }); });

  const diagnoses = edit ? db.encounterDiagnoses.filter((x) => x.encounterId === edit.id) : [];
  const procedures = edit ? db.encounterProcedures.filter((x) => x.encounterId === edit.id) : [];
  const documents = edit ? db.clinicalDocuments.filter((x) => x.encounterId === edit.id) : [];
  const specServices = db.services.filter((s) => s.active && s.specialtyId === specialtyId);

  const rx = edit ? db.prescriptions.find((r) => r.encounterId === edit.id) : null;
  const rxItems = rx ? db.prescriptionItems.filter((i) => i.rxId === rx.id) : [];
  const instructions = edit ? db.encounterInstructions.filter((x) => x.encounterId === edit.id) : [];
  const medCatalog = db.medOrderCatalog.filter((c) => c.category === "medication" && c.active && (!c.specialtyId || c.specialtyId === specialtyId));
  const insCatalog = db.medOrderCatalog.filter((c) => c.category === "instruction" && c.active && (!c.specialtyId || c.specialtyId === specialtyId));
  const linkedAppt = edit?.apptId ? db.appointments.find((a) => a.id === edit.apptId) : null;
  const linkedService = linkedAppt ? db.services.find((s) => s.name === linkedAppt.service) : null;
  const serviceDefaults = linkedService ? db.serviceDefaultOrders.filter((x) => x.serviceId === linkedService.id).map((x) => db.medOrderCatalog.find((c) => c.id === x.catalogId)).filter(Boolean) : [];

  const saveEncounter = () => {
    if (!doctorId) { setErr("اختر الطبيب"); return; }
    setErr("");
    const encId = edit ? edit.id : uid();
    const base = { id: encId, patientId, doctorId, specialtyId, apptId: edit?.apptId || "", date: edit?.date || todayStr(), chiefComplaint, hpi, examination, assessment, plan, status: "open", branchId: edit?.branchId || "" };
    update((d) => {
      if (edit) {
        const x = d.encounters.find((y) => y.id === encId);
        Object.assign(x, base);
      } else {
        d.encounters.push(base);
      }
      Object.entries(fieldValues).forEach(([fieldId, value]) => {
        const existing = d.encounterFieldValues.find((v) => v.encounterId === encId && v.fieldId === fieldId);
        if (existing) existing.value = value;
        else d.encounterFieldValues.push({ id: uid(), encounterId: encId, fieldId, value });
      });
      return d;
    }, `${edit ? "تعديل" : "تسجيل"} زيارة طبية لـ${patient.name}`);
    if (edit) close();
    else setEdit(base);
  };

  const addDiagnosis = () => {
    if (!diagInput.trim() || !edit) return;
    update((d) => {
      d.encounterDiagnoses.push({ id: uid(), encounterId: edit.id, patientId, diagnosis: diagInput.trim(), isPrimary: diagnoses.length === 0, notes: "" });
      return d;
    }, `تشخيص لـ${patient.name}: ${diagInput.trim()}`);
    setDiagInput("");
  };
  const removeDiagnosis = (x) => update((d) => { d.encounterDiagnoses = d.encounterDiagnoses.filter((y) => y.id !== x.id); return d; }, `حذف تشخيص: ${x.diagnosis}`);

  const addProcedure = (name) => {
    const n = (name || procInput).trim();
    if (!n || !edit) return;
    update((d) => {
      d.encounterProcedures.push({ id: uid(), encounterId: edit.id, patientId, doctorId, name: n, status: "done", notes: "" });
      return d;
    }, `إجراء طبي لـ${patient.name}: ${n}`);
    setProcInput("");
  };
  const removeProcedure = (x) => update((d) => { d.encounterProcedures = d.encounterProcedures.filter((y) => y.id !== x.id); return d; }, `حذف إجراء: ${x.name}`);

  const ensureRx = (d) => {
    let r = d.prescriptions.find((x) => x.encounterId === edit.id);
    if (!r) { r = { id: uid(), patientId, doctorId, encounterId: edit.id, date: edit.date || todayStr(), notes: "", status: "active" }; d.prescriptions.push(r); }
    return r;
  };
  const addMed = (name, defaultDose) => {
    const n = (name || medInput).trim();
    if (!n || !edit) return;
    update((d) => {
      const r = ensureRx(d);
      d.prescriptionItems.push({ id: uid(), rxId: r.id, name: n, strength: "", form: "", dose: defaultDose || "", route: "", frequency: "", duration: "", instructions: "" });
      return d;
    }, `دواء في روشتة ${patient.name}: ${n}`);
    setMedInput("");
  };
  const removeMed = (item) => update((d) => { d.prescriptionItems = d.prescriptionItems.filter((y) => y.id !== item.id); return d; }, `حذف دواء من روشتة ${patient.name}: ${item.name}`);
  const updateMedField = (item, key, value) => update((d) => {
    const x = d.prescriptionItems.find((y) => y.id === item.id);
    if (x) x[key] = value;
    return d;
  });

  const addInstruction = (body) => {
    const n = (body || insInput).trim();
    if (!n || !edit) return;
    update((d) => {
      d.encounterInstructions.push({ id: uid(), encounterId: edit.id, patientId, doctorId, type: "general", title: "", body: n, printable: true, shareable: true });
      return d;
    }, `تعليمة لـ${patient.name}: ${n}`);
    setInsInput("");
  };
  const removeInstruction = (x) => update((d) => { d.encounterInstructions = d.encounterInstructions.filter((y) => y.id !== x.id); return d; }, `حذف تعليمة: ${x.body}`);

  const loadServiceDefaults = () => {
    if (!edit || serviceDefaults.length === 0) return;
    update((d) => {
      const r = ensureRx(d);
      serviceDefaults.forEach((c) => {
        if (c.category === "medication") d.prescriptionItems.push({ id: uid(), rxId: r.id, name: c.name, strength: "", form: "", dose: c.defaultDose || "", route: "", frequency: "", duration: "", instructions: "" });
        else d.encounterInstructions.push({ id: uid(), encounterId: edit.id, patientId, doctorId, type: "general", title: "", body: c.name, printable: true, shareable: true });
      });
      return d;
    }, `تحميل روشتة افتراضية لخدمة ${linkedService?.name} — ${patient.name}`);
  };

  const escHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rxSummaryText = () => {
    const medsText = rxItems.map((i) => `• ${i.name}${i.dose ? " — " + i.dose : ""}${i.frequency ? " (" + i.frequency + ")" : ""}${i.duration ? " لمدة " + i.duration : ""}`).join("\n");
    const insText = instructions.map((i) => `• ${i.body}`).join("\n");
    return `روشتة ${patient.name} — ${edit.date}\n${db.clinicName}\n\n${rxItems.length ? "الأدوية:\n" + medsText + "\n\n" : ""}${instructions.length ? "التعليمات:\n" + insText : ""}`;
  };
  const printRx = () => {
    const w = window.open("", "_blank", "noopener");
    if (!w) return;
    const rows = rxItems.map((i) => `<tr><td>${escHtml(i.name)}</td><td>${escHtml(i.dose)}</td><td>${escHtml(i.frequency)}</td><td>${escHtml(i.duration)}</td></tr>`).join("");
    const insLis = instructions.map((i) => `<li>${escHtml(i.body)}</li>`).join("");
    w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>روشتة ${escHtml(patient.name)}</title>
      <style>body{font-family:Tahoma,Arial,sans-serif;padding:24px;color:#0f172a} h1{color:#0D3B41;margin-bottom:0} table{width:100%;border-collapse:collapse;margin-top:10px} td,th{border:1px solid #cbd5e1;padding:6px 8px;text-align:right;font-size:14px} li{margin-bottom:4px}</style>
      </head><body>
      <h1>${escHtml(db.clinicName)}</h1>
      <p>المريض: <b>${escHtml(patient.name)}</b> &nbsp; التاريخ: ${escHtml(edit.date)}</p>
      <p>الطبيب: ${escHtml(h.dName(doctorId))}</p>
      ${rxItems.length ? `<h3>الأدوية</h3><table><tr><th>الدواء</th><th>الجرعة</th><th>التكرار</th><th>المدة</th></tr>${rows}</table>` : ""}
      ${instructions.length ? `<h3>التعليمات</h3><ul>${insLis}</ul>` : ""}
      </body></html>`);
    w.document.close();
    w.focus();
    w.print();
  };
  const shareRx = () => window.open(waLink(patient.phone, rxSummaryText()), "_blank");

  const handleFiles = async (fileList) => {
    if (!fileList || !fileList.length || !edit) return;
    setUploading(true);
    setErr("");
    try {
      for (const file of Array.from(fileList)) {
        const path = `${CID}/${patientId}/${Date.now()}-${uid()}-${file.name}`;
        const { error } = await sb.storage.from("clinical-docs").upload(path, file);
        if (error) throw error;
        update((d) => {
          d.clinicalDocuments.push({ id: uid(), patientId, encounterId: edit.id, documentType: docType, title: file.name, storagePath: path, notes: "" });
          return d;
        }, `رفع مرفق طبي لـ${patient.name}: ${file.name}`);
      }
    } catch (e) {
      setErr("تعذر رفع الملف: " + (e.message || e));
    } finally {
      setUploading(false);
    }
  };
  const openDoc = async (doc) => {
    const { data, error } = await sb.storage.from("clinical-docs").createSignedUrl(doc.storagePath, 3600);
    if (error) { alert("تعذر فتح الملف: " + error.message); return; }
    window.open(data.signedUrl, "_blank");
  };
  const deleteDoc = async (doc) => {
    if (!window.confirm(`حذف المرفق "${doc.title}"؟`)) return;
    await sb.storage.from("clinical-docs").remove([doc.storagePath]);
    update((d) => { d.clinicalDocuments = d.clinicalDocuments.filter((x) => x.id !== doc.id); return d; }, `حذف مرفق طبي: ${doc.title}`);
  };

  const setFieldVal = (fieldId, value) => setFieldValues({ ...fieldValues, [fieldId]: value });
  const renderField = (f) => {
    const val = fieldValues[f.id] ?? "";
    if (f.type === "textarea") return <textarea rows={2} className={inputCls} value={val} onChange={(e) => setFieldVal(f.id, e.target.value)} />;
    if (f.type === "number") return <input type="number" className={inputCls} value={val} onChange={(e) => setFieldVal(f.id, e.target.value === "" ? "" : Number(e.target.value))} />;
    if (f.type === "date") return <input type="date" className={inputCls} value={val} onChange={(e) => setFieldVal(f.id, e.target.value)} />;
    if (f.type === "scale") return (
      <div className="flex items-center gap-2">
        <input type="range" min="0" max="10" className="flex-1" value={val || 0} onChange={(e) => setFieldVal(f.id, Number(e.target.value))} />
        <span className="text-sm font-bold text-brand-700 w-6 text-center">{val || 0}</span>
      </div>
    );
    if (f.type === "select" && Array.isArray(f.options)) return (
      <select className={inputCls} value={val} onChange={(e) => setFieldVal(f.id, e.target.value)}>
        <option value="">— اختر —</option>
        {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    );
    return <input type="text" className={inputCls} value={val} onChange={(e) => setFieldVal(f.id, e.target.value)} />;
  };

  return (
    <Modal title={edit ? "زيارة طبية — " + patient.name : "زيارة جديدة — " + patient.name} onClose={close}>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Field label="الطبيب">
            <select className={inputCls} value={doctorId} disabled={!h.isOwner && !!h.myDocId}
              onChange={(e) => { setDoctorId(e.target.value); const nd = db.doctors.find((d) => d.id === e.target.value); if (nd?.specialtyId) setSpecialtyId(nd.specialtyId); }}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="التخصص">
            <select className={inputCls} value={specialtyId} onChange={(e) => setSpecialtyId(e.target.value)}>
              <option value="">— بدون تحديد —</option>
              {db.specialties.filter((s) => s.active).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </Field>
        </div>
        <Field label="الشكوى الرئيسية"><textarea rows={2} className={inputCls} value={chiefComplaint} onChange={(e) => setChiefComplaint(e.target.value)} /></Field>
        <Field label="تاريخ الشكوى الحالية"><textarea rows={2} className={inputCls} value={hpi} onChange={(e) => setHpi(e.target.value)} /></Field>
        <Field label="الفحص"><textarea rows={2} className={inputCls} value={examination} onChange={(e) => setExamination(e.target.value)} /></Field>

        {sections.length > 0 && sections.map((sec) => (
          <div key={sec.key} className="border-t border-slate-100 pt-3">
            <p className="text-xs font-bold text-brand-700 mb-2">{sec.label}</p>
            <div className="space-y-2">
              {fields.filter((f) => f.section === sec.key).map((f) => (
                <Field key={f.id} label={f.label + (f.unit ? ` (${f.unit})` : "")}>{renderField(f)}</Field>
              ))}
            </div>
          </div>
        ))}

        <div className="border-t border-slate-100 pt-3 space-y-2">
          <Field label="التقييم / التشخيص المبدئي (نص عام)"><textarea rows={2} className={inputCls} value={assessment} onChange={(e) => setAssessment(e.target.value)} /></Field>
          <Field label="الخطة العلاجية"><textarea rows={2} className={inputCls} value={plan} onChange={(e) => setPlan(e.target.value)} /></Field>
        </div>

        {err && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg p-2">{err}</p>}
        <Btn className="w-full" onClick={saveEncounter}>{edit ? "حفظ التعديلات" : "حفظ الزيارة ومتابعة التفاصيل"}</Btn>

        {edit && (
          <>
            <div className="border-t border-slate-100 pt-3">
              <p className="text-xs font-bold text-brand-700 mb-2">🩺 التشخيص</p>
              {diagnoses.length > 0 && (
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {diagnoses.map((x) => (
                    <span key={x.id} className="flex items-center gap-1 text-xs bg-rose-50 text-rose-700 rounded-full px-2.5 py-1">
                      {x.diagnosis} <button onClick={() => removeDiagnosis(x)} className="hover:text-rose-900">✕</button>
                    </span>
                  ))}
                </div>
              )}
              <div className="flex gap-2">
                <input className={inputCls} placeholder="اكتب التشخيص واضغط إضافة" value={diagInput} onChange={(e) => setDiagInput(e.target.value)} />
                <Btn size="sm" tone="ghost" onClick={addDiagnosis}>إضافة</Btn>
              </div>
            </div>

            <div className="border-t border-slate-100 pt-3">
              <p className="text-xs font-bold text-brand-700 mb-2">🔧 الإجراء الطبي المتخذ</p>
              {specServices.length > 0 && (
                <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2">
                  {specServices.map((s) => (
                    <button key={s.id} type="button" onClick={() => addProcedure(s.name)}
                      className="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap bg-brand-50 text-brand-700 border border-brand-200">{s.name}</button>
                  ))}
                </div>
              )}
              {procedures.length > 0 && (
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {procedures.map((x) => (
                    <span key={x.id} className="flex items-center gap-1 text-xs bg-brand-50 text-brand-700 rounded-full px-2.5 py-1">
                      {x.name} <button onClick={() => removeProcedure(x)} className="hover:text-brand-900">✕</button>
                    </span>
                  ))}
                </div>
              )}
              <div className="flex gap-2">
                <input className={inputCls} placeholder="إجراء آخر…" value={procInput} onChange={(e) => setProcInput(e.target.value)} />
                <Btn size="sm" tone="ghost" onClick={() => addProcedure()}>إضافة</Btn>
              </div>
            </div>

            <div className="border-t border-slate-100 pt-3">
              <p className="text-xs font-bold text-brand-700 mb-2">🔬 التحاليل والأشعة والمرفقات</p>
              {documents.length > 0 && (
                <div className="space-y-1.5 mb-2">
                  {documents.map((doc) => (
                    <div key={doc.id} className="flex items-center justify-between bg-slate-50 rounded-lg p-2 text-xs">
                      <button onClick={() => openDoc(doc)} className="text-sky-600 underline truncate">{doc.documentType === "تحليل" ? "🧪" : doc.documentType === "أشعة" ? "🩻" : "📄"} {doc.title}</button>
                      {h.isOwner && <button onClick={() => deleteDoc(doc)} className="text-rose-400 hover:text-rose-600 shrink-0">✕</button>}
                    </div>
                  ))}
                </div>
              )}
              <div className="flex gap-2 items-center">
                <select className={inputCls} value={docType} onChange={(e) => setDocType(e.target.value)} style={{ maxWidth: 110 }}>
                  <option>تحليل</option><option>أشعة</option><option>آخر</option>
                </select>
                <input type="file" accept="image/*,application/pdf" capture="environment" multiple disabled={uploading}
                  onChange={(e) => handleFiles(e.target.files)} className="text-xs flex-1" />
              </div>
              {uploading && <p className="text-[11px] text-slate-400 mt-1">جارِ الرفع…</p>}
              <p className="text-[10px] text-slate-400 mt-1">تقدر تصوّر مباشرة بالكاميرا أو ترفع ملف/صورة جاهزة.</p>
            </div>

            {(h.isOwner || h.myDocId) && (
            <div className="border-t border-slate-100 pt-3">
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-bold text-brand-700">💊 الروشتة — الأدوية</p>
                {serviceDefaults.length > 0 && <Btn size="sm" tone="ghost" onClick={loadServiceDefaults}>⬇️ تحميل روشتة {linkedService.name} الافتراضية</Btn>}
              </div>
              {medCatalog.length > 0 && (
                <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2">
                  {medCatalog.map((c) => (
                    <button key={c.id} type="button" onClick={() => addMed(c.name, c.defaultDose)}
                      className="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap bg-sky-50 text-sky-700 border border-sky-200">+ {c.name}</button>
                  ))}
                </div>
              )}
              {rxItems.length > 0 && (
                <div className="space-y-1.5 mb-2">
                  {rxItems.map((it) => (
                    <div key={it.id} className="bg-slate-50 rounded-lg p-2">
                      <div className="flex items-center justify-between">
                        <p className="text-xs font-semibold">{it.name}</p>
                        <button onClick={() => removeMed(it)} className="text-rose-400 hover:text-rose-600 text-xs">✕ حذف</button>
                      </div>
                      <div className="grid grid-cols-3 gap-1.5 mt-1.5">
                        <input className="border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="الجرعة" defaultValue={it.dose} onBlur={(e) => updateMedField(it, "dose", e.target.value)} />
                        <input className="border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="التكرار" defaultValue={it.frequency} onBlur={(e) => updateMedField(it, "frequency", e.target.value)} />
                        <input className="border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="المدة" defaultValue={it.duration} onBlur={(e) => updateMedField(it, "duration", e.target.value)} />
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <div className="flex gap-2">
                <input className={inputCls} placeholder="دواء آخر…" value={medInput} onChange={(e) => setMedInput(e.target.value)} />
                <Btn size="sm" tone="ghost" onClick={() => addMed()}>إضافة</Btn>
              </div>
            </div>
            )}

            <div className="border-t border-slate-100 pt-3">
              <p className="text-xs font-bold text-brand-700 mb-2">📝 تعليمات للمريض</p>
              {insCatalog.length > 0 && (
                <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2">
                  {insCatalog.map((c) => (
                    <button key={c.id} type="button" onClick={() => addInstruction(c.name)}
                      className="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap bg-amber-50 text-amber-700 border border-amber-200">+ {c.name}</button>
                  ))}
                </div>
              )}
              {instructions.length > 0 && (
                <div className="space-y-1.5 mb-2">
                  {instructions.map((x) => (
                    <div key={x.id} className="flex items-center justify-between bg-slate-50 rounded-lg p-2 text-xs">
                      <span>{x.body}</span>
                      <button onClick={() => removeInstruction(x)} className="text-rose-400 hover:text-rose-600 shrink-0">✕</button>
                    </div>
                  ))}
                </div>
              )}
              <div className="flex gap-2">
                <input className={inputCls} placeholder="تعليمة أخرى…" value={insInput} onChange={(e) => setInsInput(e.target.value)} />
                <Btn size="sm" tone="ghost" onClick={() => addInstruction()}>إضافة</Btn>
              </div>
              {(rxItems.length > 0 || instructions.length > 0) && (
                <div className="flex gap-2 mt-3">
                  <Btn size="sm" className="flex-1" onClick={printRx}>🖨️ طباعة الروشتة</Btn>
                  <Btn size="sm" tone="wa" className="flex-1" onClick={shareRx}>📤 إرسال للمريض</Btn>
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </Modal>
  );
}

/* ---------- النوافذ ---------- */
function Modals({ modal, setModal, db, update, h, audit }) {
  /* نافذة السبب الإجباري لأي حذف/تعديل حسّاس */
  if (modal.type === "reason") return <ReasonModal modal={modal} setModal={setModal} audit={audit} />;
  if (modal.type === "stockMove") return <StockMoveModal modal={modal} setModal={setModal} audit={audit} db={db} />;
  if (modal.type === "encounter") return <EncounterModal modal={modal} setModal={setModal} db={db} update={update} h={h} />;
  const [f, setF] = useState(modal.data && modal.data.edit ? { ...modal.data.edit } : (modal.data && modal.data.prefill ? { ...modal.data.prefill } : {}));
  const [busy, setBusy] = useState(false);
  const edit = modal.data && modal.data.edit;
  const close = () => setModal(null);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  if (modal.type === "tooth") {
    const { pid, tooth } = modal.data;
    const p = db.patients.find((x) => x.id === pid);
    const cur = p.teeth?.[tooth] || { state: "سليم", note: "" };
    return (
      <Modal title={`🦷 السنّة رقم ${tooth} — ${p.name}`} onClose={close}>
        <div className="space-y-3">
          <Field label="الحالة">
            <div className="grid grid-cols-4 gap-1.5">
              {Object.entries(TOOTH_STATES).map(([name, cls]) => (
                <button key={name} onClick={() => setF({ ...f, state: name })}
                  className={`text-xs py-2 rounded-lg border-2 font-semibold ${cls} ${(f.state || cur.state) === name ? "ring-2 ring-brand-600" : ""}`}>
                  {name}
                </button>
              ))}
            </div>
          </Field>
          <Field label="ملاحظة"><input className={inputCls} value={f.note ?? cur.note} onChange={set("note")} /></Field>
          <Btn className="w-full" onClick={() => {
            const state = f.state || cur.state;
            update((d) => {
              const pt = d.patients.find((x) => x.id === pid);
              if (!pt.teeth) pt.teeth = {};
              pt.teeth[tooth] = { state, note: f.note ?? cur.note ?? "" };
              return d;
            }, `تحديث السنّة ${tooth} لـ${p.name} → ${state}`);
            close();
          }}>حفظ</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "appt") {
    const patient = db.patients.find((p) => p.id === f.patientId);
    const autoContract = f.contractId !== undefined ? f.contractId : (patient?.contractId || "");
    const contract = db.contracts.find((c) => c.id === autoContract);
    const split = contractSplit(Number(f.price || 0), contract);
    const matchedService = db.services.find((s) => s.name === (f.service || "").trim());
    const discountLimitPct = h.isStaff ? ((h.myEmp && h.myEmp.perms && h.myEmp.perms.discountLimitPct) ?? 10) : Infinity;
    const enteredPrice = Number(f.price || 0);
    const discountPct = matchedService && matchedService.price > 0 && enteredPrice < matchedService.price
      ? Math.round((1 - enteredPrice / matchedService.price) * 100) : 0;
    const overDiscount = discountPct > discountLimitPct;
    const overheadPerCase = monthlyOverheadPerCase(db, todayStr().slice(0, 7));
    const costInfo = matchedService && enteredPrice > 0 ? computeServiceCost(db, { ...matchedService, price: enteredPrice }, overheadPerCase) : null;
    return (
      <Modal title="حجز موعد جديد" onClose={close}>
        <div className="space-y-3">
          <Field label="المريض">
            <select className={inputCls} value={f.patientId || ""} onChange={set("patientId")}>
              <option value="">— اختر —</option>
              {db.patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="الطبيب">
            <select className={inputCls} value={f.doctorId || (h.isOwner ? "" : h.myDocId)} onChange={set("doctorId")} disabled={!h.isOwner}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          {db.branches.length > 1 && (
            <Field label="الفرع">
              <select className={inputCls} value={f.branchId !== undefined ? f.branchId : (modal.data.branchId || "")} onChange={set("branchId")}>
                <option value="">— بدون تحديد —</option>
                {db.branches.filter((b) => b.active).map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </Field>
          )}
          <div className="grid grid-cols-2 gap-3">
            <Field label="التاريخ"><input type="date" className={inputCls} value={f.date || modal.data.date} onChange={set("date")} /></Field>
            <Field label="الوقت"><input type="time" className={inputCls} value={f.time || ""} onChange={set("time")} /></Field>
          </div>
          <Field label="الخدمة"><input className={inputCls} placeholder="كشف، حشو، جلسة…" value={f.service || ""} onChange={set("service")} /></Field>
          {db.services.filter((s) => s.active).length > 0 && (() => {
            const currentDoctorId = f.doctorId || (h.isOwner ? "" : h.myDocId);
            const docSpecId = (db.doctors.find((d) => d.id === currentDoctorId) || {}).specialtyId || "";
            const active = db.services.filter((s) => s.active);
            const ordered = docSpecId
              ? [...active.filter((s) => s.specialtyId === docSpecId), ...active.filter((s) => s.specialtyId !== docSpecId)]
              : active;
            return (
              <div className="flex gap-1.5 overflow-x-auto pb-1 -mt-1">
                {ordered.map((s) => (
                  <button key={s.id} type="button" onClick={() => setF({ ...f, service: s.name, price: s.price })}
                    className={`px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap border ${docSpecId && s.specialtyId !== docSpecId ? "bg-slate-50 text-slate-500 border-slate-200" : "bg-brand-50 text-brand-700 border-brand-200"}`}>
                    {s.name} · {fmt(s.price)}
                  </button>
                ))}
              </div>
            );
          })()}
          <Field label="السعر (ج.م)"><input type="number" className={inputCls} value={f.price || ""} onChange={set("price")} /></Field>
          <Field label="تعاقد / نقابة (اختياري)">
            <select className={inputCls} value={autoContract} onChange={set("contractId")}>
              <option value="">بدون — خاص</option>
              {db.contracts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          {contract && Number(f.price) > 0 && (
            <div className="bg-violet-50 rounded-xl p-3 text-xs text-violet-800 space-y-1">
              <p>الصافي بعد خصم {contract.discount}%: <b>{fmt(split.net)}</b></p>
              <p>يدفع المريض: <b>{fmt(split.patientShare)}</b> · على الجهة: <b>{fmt(split.entityShare)}</b></p>
            </div>
          )}
          {discountPct > 0 && (
            <p className={`text-xs rounded-xl p-2.5 border ${overDiscount ? "bg-rose-50 border-rose-200 text-rose-700" : "bg-slate-50 border-slate-200 text-slate-600"}`}>
              خصمك عن سعر الخدمة الأساسي ({fmt(matchedService.price)}): <b>{discountPct}%</b>
              {overDiscount && <> — 🚨 أكبر من الحد المسموح لك ({discountLimitPct}%)</>}
            </p>
          )}
          {costInfo && costInfo.margin < 0 && (
            <p className="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5">
              🚨 السعر المدخل أقل من التكلفة الحقيقية للخدمة ({fmt(Math.round(costInfo.totalCost))}) — خسارة {fmt(Math.round(-costInfo.margin))}.
            </p>
          )}
          <Btn className="w-full" onClick={() => {
            const doctorId = f.doctorId || (h.isOwner ? "" : h.myDocId);
            if (!f.patientId || !doctorId || !f.time) return;
            if (overDiscount) { alert(`خصمك ${discountPct}% أكبر من الحد المسموح لك (${discountLimitPct}%) — راجع صاحب العيادة.`); return; }
            update((d) => {
              d.appointments.push({
                id: uid(), patientId: f.patientId, doctorId, date: f.date || modal.data.date, time: f.time,
                service: f.service || "كشف", price: Number(f.price || 0), contractId: autoContract || "",
                patientShare: split.patientShare, entityShare: split.entityShare, entityPaid: false, paid: 0, status: "محجوز",
                branchId: (f.branchId !== undefined ? f.branchId : (modal.data.branchId || "")) || "",
              });
              return d;
            }, `حجز موعد لـ${h.pName(f.patientId)} — ${f.service || "كشف"}`);
            close();
          }}>حفظ الحجز</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "collect") {
    const a = modal.data;
    const p = db.patients.find((x) => x.id === a.patientId);
    const share = a.patientShare ?? a.price;
    const due = Math.max(0, share - a.paid);
    const usePts = f.usePts === "1";
    const redeem = usePts ? Math.min(p.points || 0, due) : 0;
    const cashDue = due - redeem;
    const method = f.method || "كاش";
    const currency = f.currency || "EGP";
    const isForeign = currency !== "EGP";
    const fxRate = Number(f.fxRate) || 1;
    const foreignAmount = f.foreignAmount ?? "";
    const egpFromForeign = Math.round((Number(foreignAmount) || 0) * fxRate);
    const amount = isForeign ? egpFromForeign : Number(f.amount ?? cashDue);
    return (
      <Modal title={`تحصيل من ${p.name}`} onClose={close}>
        <div className="space-y-3">
          <p className="text-sm text-slate-600">المتبقي: <b className="text-amber-700">{fmt(due)}</b></p>
          {(p.points || 0) > 0 && (
            <label className="flex items-center gap-2 bg-yellow-50 rounded-xl p-3 text-sm cursor-pointer">
              <input type="checkbox" checked={usePts} onChange={(e) => setF({ ...f, usePts: e.target.checked ? "1" : "0", amount: undefined })} />
              <span>⭐ استبدال نقاط الولاء ({p.points} نقطة = خصم حتى {fmt(Math.min(p.points, due))})</span>
            </label>
          )}
          {usePts && <p className="text-xs text-emerald-700">خصم النقاط: −{fmt(redeem)} · المطلوب: <b>{fmt(cashDue)}</b></p>}

          <div className="grid grid-cols-2 gap-3">
            <Field label="طريقة الدفع">
              <select className={inputCls} value={method} onChange={set("method")}>
                {PAYMENT_METHODS.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </Field>
            <Field label="العملة">
              <select className={inputCls} value={currency} onChange={set("currency")}>
                {CURRENCIES.map((c) => <option key={c} value={c}>{c === "EGP" ? "جنيه مصري" : c}</option>)}
              </select>
            </Field>
          </div>

          {isForeign ? (
            <>
              <div className="grid grid-cols-2 gap-3">
                <Field label={`المبلغ بال${currency}`}>
                  <input type="number" className={inputCls} value={foreignAmount} onChange={set("foreignAmount")} />
                </Field>
                <Field label="سعر الصرف (١ = كام جنيه)">
                  <input type="number" step="0.01" className={inputCls} value={f.fxRate ?? 1} onChange={set("fxRate")} />
                </Field>
              </div>
              <p className="text-xs text-slate-500">يعادل: <b className="text-emerald-700">{fmt(Math.min(egpFromForeign, cashDue))}</b>{egpFromForeign > cashDue && " (هيتقفل عند المتبقي)"}</p>
            </>
          ) : (
            <Field label="المبلغ المحصَّل">
              <input type="number" className={inputCls} value={f.amount ?? cashDue} onChange={set("amount")} />
            </Field>
          )}

          <Btn className="w-full" tone="emerald" disabled={busy} onClick={async () => {
            const cash = Math.min(Math.max(0, amount), cashDue);
            if (cash < 0 || (cash === 0 && redeem === 0)) return;
            const earned = Math.floor(cash / 100) * POINTS_PER_100;
            setBusy(true);
            try {
              // زيادة ذرية على السيرفر (مش حساب محلي) عشان لو حد تاني بيحصّل نفس الموعد في نفس اللحظة، مفيش تحصيلة تضيع
              let newPaid = a.paid;
              if (cash + redeem !== 0) {
                const { data, error } = await sb.rpc("collect_appointment_payment", { p_appt_id: a.id, p_amount: cash + redeem });
                if (error) throw error;
                newPaid = data;
              }
              let newPoints = p.points || 0;
              if (earned - redeem !== 0) {
                const { data, error } = await sb.rpc("adjust_patient_points", { p_patient_id: a.patientId, p_delta: earned - redeem });
                if (error) throw error;
                newPoints = data;
              }
              update((d) => {
                const appt = d.appointments.find((x) => x.id === a.id);
                appt.paid = newPaid;
                const pt = d.patients.find((x) => x.id === a.patientId);
                pt.points = newPoints;
                if (cash > 0)
                  d.payments.push({
                    id: uid(), date: todayStr(), patientId: a.patientId, doctorId: a.doctorId, apptId: a.id,
                    amount: cash, note: a.service, source: "مريض", branchId: a.branchId,
                    method, currency, fxRate: isForeign ? fxRate : 1, foreignAmount: isForeign ? (Number(foreignAmount) || 0) : null,
                  });
                return d;
              }, `تحصيل ${fmt(cash)} من ${p.name} (${method}${isForeign ? ` — ${foreignAmount} ${currency}` : ""})${redeem ? ` + استبدال ${redeem} نقطة` : ""}${earned ? ` (كسب ${earned} نقطة)` : ""}`);
              close();
            } catch (e) {
              alert("⚠️ تعذر تسجيل التحصيل — تأكد من الاتصال بالإنترنت وحاول تاني.\n" + (e.message || e));
              setBusy(false);
            }
          }}>{busy ? "جارِ التحصيل…" : "تأكيد التحصيل"}</Btn>
          <p className="text-[10px] text-slate-400">يكسب المريض {POINTS_PER_100} نقاط تلقائياً عن كل 100 ج.م مدفوعة.</p>
        </div>
      </Modal>
    );
  }

  if (modal.type === "patient") {
    return (
      <Modal title={edit ? "تعديل بيانات مريض" : "إضافة مريض"} onClose={close}>
        <div className="space-y-3">
          <Field label="الاسم"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <Field label="رقم الموبايل (واتساب)"><input dir="ltr" className={inputCls} placeholder="01xxxxxxxxx" value={f.phone || ""} onChange={set("phone")} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="النوع">
              <select className={inputCls} value={f.gender || ""} onChange={set("gender")}>
                <option value="">—</option><option>ذكر</option><option>أنثى</option>
              </select>
            </Field>
            <Field label="السن"><input type="number" className={inputCls} value={f.age || ""} onChange={set("age")} /></Field>
          </div>
          <Field label="تعاقد / نقابة">
