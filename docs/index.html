      pName: (id) => db.patients.find((p) => p.id === id)?.name || "—",
      pPhone: (id) => db.patients.find((p) => p.id === id)?.phone || "",
      dName: (id) => db.doctors.find((d) => d.id === id)?.name || "—",
      cName: (id) => db.contracts.find((c) => c.id === id)?.name || "",
      isOwner: user?.role === "owner",
      myDocId: user?.doctorId,
      isStaff: user?.role === "staff",
      myEmp: user?.role === "staff" ? db.employees.find((e) => e.id === user.empId) : null,
      can: (p) => {
        if (user?.role === "owner") return true;
        if (user?.role === "staff") {
          const emp = db.employees.find((e) => e.id === user.empId);
          return !!(emp && emp.perms && emp.perms[p]);
        }
        return false;
      },
    };
  }, [db, user]);

  if (!db)
    return <div className="min-h-screen flex items-center justify-center bg-[#FAF6EE] text-brand-800 font-bold" dir="rtl">جارِ التحميل…</div>;



  const ownerTabs = [
    ["branches", "🏢", "الفروع"],
    ["dash", "🏠", "الرئيسية"], ["appts", "📅", "المواعيد"], ["patients", "🧑‍🤝‍🧑", "المرضى"],
    ["finance", "💰", "الماليات"], ["reports", "📊", "التقارير"], ["contracts", "📜", "التعاقدات"],
    ["lab", "🦷", "المعمل"], ["staff", "🕐", "الموظفون"], ["inv", "📦", "المخزن"],
    ["ai", "✨", "المساعد الذكي"],
    ["watch", "🚨", "الرقابة"], ["logs", "📝", "سجل النشاط"], ["settings", "⚙️", "الحسابات"],
  ];
  const doctorTabs = [["dash", "🏠", "يومي"], ["appts", "📅", "مواعيدي"], ["patients", "🧑‍🤝‍🧑", "المرضى"], ["ai", "✨", "المساعد الذكي"], ["myacc", "💼", "حسابي"]];
  const staffTabs = [
    ["dash", "🏠", "يومي"],
    ...(h.can("appts") ? [["appts", "📅", "المواعيد"]] : []),
    ...(h.can("patients") ? [["patients", "🧑‍🤝‍🧑", "المرضى"]] : []),
    ...(h.can("inventory") ? [["inv", "📦", "المخزن"]] : []),
    ...(h.can("payroll") ? [["payroll", "💰", "مكافآت وخصومات"]] : []),
    ...(h.can("reports") ? [["reports", "📊", "التقارير"]] : []),
    ...(h.can("contracts") ? [["contracts", "📜", "التعاقدات"]] : []),
    ...(h.can("lab") ? [["lab", "🦷", "المعمل"]] : []),
    ...(h.can("hr") ? [["staff", "🕐", "الموظفون"]] : []),
    ["ai", "✨", "المساعد الذكي"],
    ["myattend", "🕐", "حضوري"],
  ];
  const tabs = h.isOwner ? ownerTabs : h.isStaff ? staffTabs : doctorTabs;

  return (
    <div dir="rtl" className="min-h-screen bg-[#FAF6EE] text-slate-800"
      style={{ fontFamily: "'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap');`}</style>

      <header className="text-white px-4 pt-4 pb-3 sticky top-0 z-40" style={{ background: "linear-gradient(160deg, #145F66, #0D3B41 55%, #0A2C24)" }}>
        <div className="flex items-center justify-between max-w-5xl mx-auto">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style={{ background: "#16525A" }}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E7C9C1" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3.2c-2 0-3 .9-4.4.9-1.7 0-3.3-1.2-4.3-.2C2.2 4.9 2.4 6.9 2.8 9c.4 2.3 1 5.5 2 7.9.6 1.4 1.3 2.5 2.3 2.5 1.4 0 1.2-3.1 2.1-5.2.4-1 .8-1.6 1-1.6s.5.6.9 1.6c.9 2.1.7 5.2 2.1 5.2 1 0 1.7-1.1 2.3-2.5.9-2.3 1.6-5.5 2-7.9.4-2.1.5-4.1-.6-5.1-1-.9-2.5.2-4.1.2-1.4 0-2.4-.9-4.4-.9Z" />
              </svg>
            </div>
            <div>
              <h1 className="font-brand text-lg leading-none">{db.clinicName}</h1>
              <p className="text-[#D7C6C0] text-xs mt-1">{h.isOwner ? "👑 الأكونت الرئيسي" : h.isStaff ? `👤 ${h.myEmp?.name || "موظف"} — ${h.myEmp?.role || ""}` : `🩺 ${h.dName(user.doctorId)}`}</p>
            </div>
          </div>
          <button onClick={() => boot.signOut()}
            className="bg-transparent hover:bg-white/10 text-[#D7C6C0] text-xs px-3 py-1.5 rounded-full border" style={{ borderColor: "#1F5C63" }}>خروج</button>
        </div>
        <div className="flex items-center gap-2 mt-3 max-w-5xl sm:mx-auto">
          <button onClick={() => setMenuOpen(true)} aria-label="القائمة"
            className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 bg-white/5 hover:bg-white/10 border transition-colors" style={{ borderColor: "#1F5C63" }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7C6C0" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div className="flex items-center gap-1.5 bg-white text-brand-900 px-3 py-1.5 rounded-lg text-sm font-semibold">
            <TabIcon id={patientView ? "patients" : tab} />
            {patientView ? "بيانات المريض" : (tabs.find((t) => t[0] === tab)?.[2] || "")}
          </div>
          {boot.offline && (
            <span className="text-[11px] bg-amber-500/20 text-amber-100 border border-amber-300/40 rounded-full px-2.5 py-1 font-semibold whitespace-nowrap">
              🔌 وضع بدون اتصال
            </span>
          )}
          {pendingSync > 0 && (
            <span className="text-[11px] bg-white/10 text-[#D7C6C0] border rounded-full px-2.5 py-1 font-semibold whitespace-nowrap" style={{ borderColor: "#1F5C63" }}>
              ⏳ {pendingSync} في انتظار الاتصال
            </span>
          )}
        </div>
      </header>

      {menuOpen && (
        <div className="fixed inset-0 z-[60]">
          <div className="absolute inset-0 bg-black/40" onClick={() => setMenuOpen(false)} />
          <div className="absolute top-0 bottom-0 right-0 w-[300px] max-w-[85vw] bg-white shadow-2xl flex flex-col">
            <div className="flex items-center justify-between px-5 py-5 shrink-0" style={{ background: "linear-gradient(160deg, #145F66, #0D3B41 70%)" }}>
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: "#16525A" }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E7C9C1" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3.2c-2 0-3 .9-4.4.9-1.7 0-3.3-1.2-4.3-.2C2.2 4.9 2.4 6.9 2.8 9c.4 2.3 1 5.5 2 7.9.6 1.4 1.3 2.5 2.3 2.5 1.4 0 1.2-3.1 2.1-5.2.4-1 .8-1.6 1-1.6s.5.6.9 1.6c.9 2.1.7 5.2 2.1 5.2 1 0 1.7-1.1 2.3-2.5.9-2.3 1.6-5.5 2-7.9.4-2.1.5-4.1-.6-5.1-1-.9-2.5.2-4.1.2-1.4 0-2.4-.9-4.4-.9Z" />
                  </svg>
                </div>
                <span className="font-brand text-lg text-white">{db.clinicName}</span>
              </div>
              <button onClick={() => setMenuOpen(false)} aria-label="إغلاق"
                className="w-8 h-8 rounded-lg flex items-center justify-center bg-white/10 border" style={{ borderColor: "#1F5C63" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D7C6C0" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
              </button>
            </div>
            <div className="p-3 overflow-y-auto flex-1 space-y-1">
              {tabs.map(([id, , label]) => {
                const active = tab === id && !patientView;
                return (
                  <button key={id} onClick={() => { setTab(id); setPatientView(null); setBranchView(null); setMenuOpen(false); }}
                    className="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm text-right transition-colors"
                    style={active ? { background: "#F3E2DC" } : undefined}
                    onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#FAF6EE"; }}
                    onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = ""; }}>
                    <span className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                      style={active ? { background: "#EAD2C9", color: "#9C5C4B" } : { background: "#F4EFE4", color: "#6C7A6F" }}>
                      <TabIcon id={id} />
                    </span>
                    <span className={active ? "font-bold text-brand-900" : "font-medium text-slate-700"}>{label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <main className="max-w-5xl mx-auto p-4 pb-24 space-y-4">
        {patientView ? (
          <PatientSheet db={db} h={h} pid={patientView} back={() => setPatientView(null)} setModal={setModal} update={update} audit={audit} />
        ) : (
          <>
            {tab === "branches" && h.isOwner && (
              branchView
                ? <BranchDetail db={db} h={h} branchId={branchView} back={() => setBranchView(null)} update={update} setModal={setModal} audit={audit} />
                : <Branches db={db} h={h} setModal={setModal} openBranch={setBranchView} />
            )}
            {tab === "ai" && <AiAssistant db={db} h={h} setModal={setModal} />}
            {tab === "dash" && <Dashboard db={db} h={h} update={update} />}
            {tab === "appts" && <Appointments db={db} h={h} update={update} setModal={setModal} />}
            {tab === "patients" && <Patients db={db} h={h} setModal={setModal} openSheet={setPatientView} update={update} />}
            {tab === "finance" && h.isOwner && <Finance db={db} h={h} setModal={setModal} update={update} />}
            {tab === "reports" && (h.isOwner || h.can("reports")) && <Reports db={db} h={h} update={update} />}
            {tab === "contracts" && (h.isOwner || h.can("contracts")) && <Contracts db={db} h={h} update={update} setModal={setModal} />}
            {tab === "lab" && (h.isOwner || h.can("lab")) && <Lab db={db} h={h} update={update} setModal={setModal} />}
            {tab === "staff" && (h.isOwner || h.can("hr")) && <Staff db={db} update={update} setModal={setModal} h={h} />}
            {tab === "inv" && (h.isOwner || h.can("inventory")) && <Inventory db={db} update={update} setModal={setModal} audit={audit} h={h} />}
            {tab === "payroll" && !h.isOwner && h.can("payroll") && <PayrollActions db={db} update={update} setModal={setModal} h={h} />}
            {tab === "logs" && h.isOwner && <Logs db={db} />}
            {tab === "watch" && h.isOwner && <Watchtower db={db} />}
            {tab === "settings" && h.isOwner && <Settings db={db} update={update} setModal={setModal} />}
            {tab === "myacc" && !h.isOwner && !h.isStaff && <MyAccount db={db} h={h} />}
            {tab === "myattend" && h.isStaff && <MyAttendance db={db} h={h} update={update} />}
          </>
        )}
      </main>

      {modal && <Modals key={modal.type + ((modal.data && (modal.data.edit ? modal.data.edit.id : modal.data.id)) || "")} modal={modal} setModal={setModal} db={db} update={update} h={h} audit={audit} />}
    </div>
  );
}

/* ---------- الدخول ---------- */
/* ---------- الرئيسية ---------- */
function Dashboard({ db, h, update }) {
  const t = todayStr();
  const tomorrow = new Date(Date.now() + 86400000).toLocaleDateString("en-CA");
  const mine = (a) => h.isOwner || h.isStaff || a.doctorId === h.myDocId;
  const todays = db.appointments.filter((a) => a.date === t && a.status !== "ملغي" && mine(a)).sort((a, b) => a.time.localeCompare(b.time));
  const tomorrowAppts = db.appointments.filter((a) => a.date === tomorrow && a.status !== "ملغي" && mine(a)).sort((a, b) => a.time.localeCompare(b.time));
  const tomorrowPending = tomorrowAppts.filter((a) => !a.reminderSent);
  const collectedToday = db.payments.filter((p) => p.date === t && (h.isOwner || h.isStaff || p.doctorId === h.myDocId)).reduce((s, p) => s + p.amount, 0);
  const dues = db.appointments.filter((a) => a.status !== "ملغي" && mine(a)).reduce((s, a) => s + Math.max(0, (a.patientShare ?? a.price) - a.paid), 0);
  const lowStock = db.inventory.filter((i) => i.qty <= i.min);
  const entityDues = db.appointments.filter((a) => a.entityShare > 0 && !a.entityPaid && a.status !== "ملغي").reduce((s, a) => s + a.entityShare, 0);

  const remind = (a) => {
    const msg = `مرحباً ${h.pName(a.patientId)} 👋\nتذكير بموعدك في ${db.clinicName} اليوم الساعة ${a.time} مع ${h.dName(a.doctorId)}.\nنتشرف بحضورك 🌟`;
    window.open(waLink(h.pPhone(a.patientId), msg), "_blank");
  };
  const remindTomorrow = (a) => {
    const msg = `مرحباً ${h.pName(a.patientId)} 👋\nتذكير بموعدك بكرة في ${db.clinicName} الساعة ${a.time} مع ${h.dName(a.doctorId)}.\nنتشرف بحضورك 🌟`;
    window.open(waLink(h.pPhone(a.patientId), msg), "_blank");
    update((d) => { d.appointments.find((x) => x.id === a.id).reminderSent = true; return d; });
  };

  return (
    <>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <Stat label={h.myDocId ? "مواعيدي اليوم" : "مواعيد اليوم"} value={todays.length} />
        {(h.isOwner || h.myDocId || h.can("collect")) && <Stat label="تحصيلات اليوم" value={fmt(collectedToday)} tone="emerald" />}
        {(h.isOwner || h.myDocId || h.can("collect")) && <Stat label="مستحقات المرضى" value={fmt(dues)} tone="amber" />}
        {h.isOwner
          ? <Stat label="مستحق على النقابات" value={fmt(entityDues)} tone="violet" />
          : h.myDocId
            ? <Stat label="خطط علاج جارية" value={db.plans.filter((p) => p.doctorId === h.myDocId && p.status !== "تم").length} tone="violet" />
            : <Stat label="دوري" value={h.myEmp?.role || "موظف"} tone="violet" />}
      </div>

      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-3">📅 مواعيد اليوم</h2>
        {todays.length === 0 ? <Empty text="لا توجد مواعيد اليوم ☕" /> : (
          <div className="space-y-2">
            {todays.map((a) => (
              <div key={a.id} className="flex items-center gap-3 bg-brand-50/60 rounded-xl p-3">
                <div className="bg-brand-700 text-white rounded-lg px-2 py-1 text-xs font-bold min-w-[52px] text-center">{a.time}</div>
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-sm truncate">{h.pName(a.patientId)}</p>
                  <p className="text-xs text-slate-500 truncate">{a.service} · {h.dName(a.doctorId)}{a.contractId && ` · 📜 ${h.cName(a.contractId)}`}</p>
                </div>
                <Btn size="sm" tone="wa" onClick={() => remind(a)}>واتساب</Btn>
              </div>
            ))}
          </div>
        )}
      </Card>

      {tomorrowAppts.length > 0 && (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-display font-bold text-brand-900">🔔 تذكير بمواعيد بكرة</h2>
            <span className="text-xs font-semibold text-slate-500">{tomorrowAppts.length - tomorrowPending.length} من {tomorrowAppts.length} اتذكّروا</span>
          </div>
          {tomorrowPending.length === 0 ? <Empty text="كل مواعيد بكرة اتذكّر بيها ✅" /> : (
            <div className="space-y-2">
              {tomorrowPending.map((a) => (
                <div key={a.id} className="flex items-center gap-3 bg-amber-50/60 rounded-xl p-3">
                  <div className="bg-amber-500 text-white rounded-lg px-2 py-1 text-xs font-bold min-w-[52px] text-center">{a.time}</div>
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-sm truncate">{h.pName(a.patientId)}</p>
                    <p className="text-xs text-slate-500 truncate">{a.service} · {h.dName(a.doctorId)}</p>
                  </div>
                  <Btn size="sm" tone="wa" onClick={() => remindTomorrow(a)}>واتساب</Btn>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {h.isOwner && lowStock.length > 0 && (
        <Card className="p-4">
          <h2 className="font-bold text-rose-700 mb-2">⚠️ نواقص المخزن</h2>
          {lowStock.map((i) => <p key={i.id} className="text-sm text-rose-700">• {i.name}: متبقي {i.qty} {i.unit}</p>)}
        </Card>
      )}
    </>
  );
}

/* ---------- المواعيد ---------- */
function Appointments({ db, h, update, setModal }) {
  const [date, setDate] = useState(todayStr());
  const [spec, setSpec] = useState("");
  const [branchId, setBranchId] = useState("");
  const specs = [...new Set(db.doctors.map((d) => d.specialty).filter(Boolean))];
  const docSpec = (id) => db.doctors.find((d) => d.id === id)?.specialty || "";
  const branchName = (id) => db.branches.find((b) => b.id === id)?.name || "";
  const list = db.appointments
    .filter((a) => a.date === date && (h.isOwner || h.isStaff || a.doctorId === h.myDocId))
    .filter((a) => !spec || docSpec(a.doctorId) === spec)
    .filter((a) => !branchId || a.branchId === branchId)
    .sort((a, b) => a.time.localeCompare(b.time));
  const statusTone = { "محجوز": "bg-sky-100 text-sky-700", "تم": "bg-emerald-100 text-emerald-700", "ملغي": "bg-slate-200 text-slate-500" };

  const remind = (a) => {
    const msg = `مرحباً ${h.pName(a.patientId)} 👋\nتذكير بموعدك في ${db.clinicName} يوم ${a.date} الساعة ${a.time} مع ${h.dName(a.doctorId)}.\nنتشرف بحضورك 🌟`;
    window.open(waLink(h.pPhone(a.patientId), msg), "_blank");
  };
  const setStatus = (a, status) =>
    update((d) => { d.appointments.find((x) => x.id === a.id).status = status; return d; },
      `${status === "تم" ? "إنهاء كشف" : "إلغاء موعد"} — ${h.pName(a.patientId)} (${a.service})`);

  return (
    <>
      <div className="flex items-center gap-2">
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={inputCls + " flex-1"} />
        <Btn onClick={() => setModal({ type: "appt", data: { date, branchId } })}>+ حجز جديد</Btn>
      </div>
      {(h.isOwner || h.isStaff) && db.branches.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setBranchId("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${branchId === "" ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>كل الفروع</button>
          {db.branches.map((b) => (
            <button key={b.id} onClick={() => setBranchId(b.id)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${branchId === b.id ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>🏢 {b.name}</button>
          ))}
        </div>
      )}
      {(h.isOwner || h.isStaff) && specs.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setSpec("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === "" ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>كل التخصصات</button>
          {specs.map((s) => (
            <button key={s} onClick={() => setSpec(s)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === s ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{s}</button>
          ))}
        </div>
      )}
      {list.length === 0 ? <Card className="p-4"><Empty text="لا توجد مواعيد في هذا اليوم" /></Card> : (
        <div className="space-y-3">
          {list.map((a) => {
            const share = a.patientShare ?? a.price;
            const due = Math.max(0, share - a.paid);
            return (
              <Card key={a.id} className="p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p className="font-bold">{a.time} — {h.pName(a.patientId)}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{a.service} · {h.dName(a.doctorId)}{db.branches.length > 1 && a.branchId && ` · 🏢 ${branchName(a.branchId)}`}</p>
                    {a.contractId && <p className="text-xs text-violet-600 mt-0.5">📜 {h.cName(a.contractId)} — على الجهة {fmt(a.entityShare)}</p>}
                  </div>
                  <span className={`text-xs px-2 py-1 rounded-full font-semibold ${statusTone[a.status]}`}>{a.status}</span>
                </div>
                <div className="flex flex-wrap gap-2 mt-3 text-xs">
                  <span className="bg-slate-100 rounded-lg px-2 py-1">السعر: <b>{fmt(a.price)}</b></span>
                  <span className="bg-brand-50 text-brand-700 rounded-lg px-2 py-1">على المريض: <b>{fmt(share)}</b></span>
                  <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-1">مدفوع: <b>{fmt(a.paid)}</b></span>
                  {due > 0 && <span className="bg-amber-50 text-amber-700 rounded-lg px-2 py-1">متبقي: <b>{fmt(due)}</b></span>}
                </div>
                <div className="flex flex-wrap gap-2 mt-3">
                  <Btn size="sm" tone="wa" onClick={() => remind(a)}>تذكير واتساب</Btn>
                  {due > 0 && a.status !== "ملغي" && (h.isOwner || h.myDocId || h.can("collect")) && <Btn size="sm" tone="amber" onClick={() => setModal({ type: "collect", data: a })}>تحصيل</Btn>}
                  {a.status === "محجوز" && (
                    <>
                      <Btn size="sm" tone="emerald" onClick={() => setStatus(a, "تم")}>تم الكشف</Btn>
                      <Btn size="sm" tone="ghost" onClick={() => setStatus(a, "ملغي")}>إلغاء</Btn>
                    </>
                  )}
                  {h.isOwner && (
                    <Btn size="sm" tone="rose" onClick={() => setModal({ type: "reason", data: {
                      title: "حذف موعد " + h.pName(a.patientId), area: "المواعيد والأسعار", act: "حذف موعد/خدمة", item: h.pName(a.patientId) + " — " + a.service,
                      before: fmt(a.price), after: "محذوف",
                      apply: (d) => { d.appointments = d.appointments.filter((x) => x.id !== a.id); return d; },
                    } })}>حذف</Btn>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </>
  );
}

/* ---------- المرضى ---------- */
function Patients({ db, h, setModal, openSheet, update }) {
  const [q, setQ] = useState("");
  const [spec, setSpec] = useState("");
  const specs = [...new Set(db.doctors.map((d) => d.specialty).filter(Boolean))];
  const patientSpecs = (pid) => {
    const s = new Set();
    db.plans.filter((x) => x.patientId === pid).forEach((x) => { if (x.specialty) s.add(x.specialty); });
    db.appointments.filter((x) => x.patientId === pid).forEach((x) => {
      const d = db.doctors.find((y) => y.id === x.doctorId);
      if (d && d.specialty) s.add(d.specialty);
    });
    return [...s];
  };
  const list = db.patients
    .filter((p) => (p.name + p.phone).includes(q))
    .filter((p) => !spec || patientSpecs(p.id).includes(spec));
  return (
    <>
      <div className="flex gap-2">
        <input placeholder="بحث بالاسم أو الرقم…" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " flex-1"} />
        <Btn onClick={() => setModal({ type: "patient" })}>+ مريض</Btn>
      </div>
      {specs.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setSpec("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === "" ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>كل التخصصات</button>
          {specs.map((s) => (
            <button key={s} onClick={() => setSpec(s)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${spec === s ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{s}</button>
          ))}
        </div>
      )}
      <div className="space-y-2">
        {list.map((p) => (
          <Card key={p.id} className="p-4 flex items-center gap-3">
            <div className="w-10 h-10 rounded-full bg-brand-100 text-brand-800 font-bold flex items-center justify-center shrink-0">{p.name[0]}</div>
            <div className="flex-1 min-w-0">
              <p className="font-semibold truncate">{p.name} <span className="text-xs text-amber-600 font-bold">⭐ {p.points || 0}</span></p>
              <p className="text-xs text-slate-500" dir="ltr">{p.phone}</p>
              {p.contractId && <p className="text-xs text-violet-600">📜 {h.cName(p.contractId)}</p>}
              {patientSpecs(p.id).length > 0 && <p className="text-[10px] text-slate-400 mt-0.5">🏷️ {patientSpecs(p.id).join(" · ")}</p>}
            </div>
            <div className="flex flex-col gap-1.5 items-stretch shrink-0">
              <Btn size="sm" onClick={() => openSheet(p.id)}>فتح الشيت</Btn>
              {h.isOwner && (
                <div className="flex gap-1.5">
                  <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "patient", data: { edit: p } })}>تعديل</Btn>
                  <Btn size="sm" tone="rose" onClick={() => {
                    if (!window.confirm("حذف " + p.name + "؟ سيُحذف شيته وخطة علاجه ومواعيده نهائياً.")) return;
                    update((d) => {
                      d.patients = d.patients.filter((x) => x.id !== p.id);
                      d.plans = d.plans.filter((x) => x.patientId !== p.id);
                      d.appointments = d.appointments.filter((x) => x.patientId !== p.id);
                      d.labCases = d.labCases.filter((x) => x.patientId !== p.id);
                      return d;
                    }, "حذف المريض: " + p.name);
                  }}>حذف</Btn>
                </div>
              )}
            </div>
          </Card>
        ))}
      </div>
    </>
  );
}

/* ---------- مخطط الأسنان ---------- */
function DentalChart({ patient, setModal }) {
  const teeth = patient.teeth || {};
  const Tooth = ({ n }) => {
    const st = teeth[n]?.state || "سليم";
    return (
      <button onClick={() => setModal({ type: "tooth", data: { pid: patient.id, tooth: n } })}
        title={teeth[n]?.note || st}
        className={`w-8 h-9 rounded-lg border-2 text-[10px] font-bold flex items-center justify-center shrink-0 transition-transform hover:scale-110 ${TOOTH_STATES[st]}`}>
        {n}
      </button>
    );
  };
  return (
    <div>
      <div className="overflow-x-auto pb-1">
        <div className="flex gap-1 justify-center min-w-max mb-1">{UPPER.map((n) => <Tooth key={n} n={n} />)}</div>
        <div className="flex gap-1 justify-center min-w-max">{LOWER.map((n) => <Tooth key={n} n={n} />)}</div>
      </div>
      <div className="flex flex-wrap gap-1.5 mt-3 justify-center">
        {Object.entries(TOOTH_STATES).map(([name, cls]) => (
          <span key={name} className={`text-[10px] px-2 py-0.5 rounded-full border ${cls}`}>{name}</span>
        ))}
      </div>
      <p className="text-[10px] text-slate-400 text-center mt-2">اضغط على أي سنّة لتسجيل حالتها (ترقيم FDI العالمي)</p>
    </div>
  );
}

/* ---------- شيت المريض ---------- */
function PatientSheet({ db, h, pid, back, setModal, update, audit }) {
  const p = db.patients.find((x) => x.id === pid);
  if (!p) return null;
  const plans = db.plans.filter((x) => x.patientId === pid);
  const visits = db.appointments.filter((a) => a.patientId === pid).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const encounters = db.encounters.filter((x) => x.patientId === pid).sort((a, b) => b.date.localeCompare(a.date));
  const totalDue = visits.filter((a) => a.status !== "ملغي").reduce((s, a) => s + Math.max(0, (a.patientShare ?? a.price) - a.paid), 0);
  const contract = db.contracts.find((c) => c.id === p.contractId);

  const cyclePlan = (pl) =>
    update((d) => {
      const x = d.plans.find((y) => y.id === pl.id);
      x.status = x.status === "مقترح" ? "جاري" : x.status === "جاري" ? "تم" : "مقترح";
      return d;
    }, `تحديث خطة علاج ${p.name}: ${pl.procedure}`);

  return (
    <>
      <div className="flex items-center gap-2">
        <Btn size="sm" tone="ghost" onClick={back}>→ رجوع</Btn>
        <h2 className="font-display font-bold text-brand-900 text-lg">📋 شيت المريض</h2>
      </div>

      <Card className="p-4">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-full bg-brand-700 text-white font-bold flex items-center justify-center text-lg">{p.name[0]}</div>
          <div className="flex-1">
            <p className="font-bold">{p.name} <span className="text-xs text-slate-400">· {p.gender || ""} {p.age ? `· ${p.age} سنة` : ""}</span></p>
            <p className="text-xs text-slate-500" dir="ltr">{p.phone}</p>
            {contract && <p className="text-xs text-violet-600 mt-0.5">📜 {contract.name}</p>}
          </div>
          <Btn size="sm" tone="wa" onClick={() => window.open(waLink(p.phone, `مرحباً ${p.name} 👋 من ${db.clinicName}`), "_blank")}>واتساب</Btn>
        </div>
        {p.notes && <p className="text-xs text-rose-600 mt-3 bg-rose-50 rounded-lg p-2">⚕️ {p.notes}</p>}
        <div className="flex flex-wrap gap-2 mt-3 text-xs">
          {h.isOwner && <span className="bg-amber-50 text-amber-700 rounded-lg px-2 py-1">مستحق عليه: <b>{fmt(totalDue)}</b></span>}
          <span className="bg-yellow-50 text-yellow-700 rounded-lg px-2 py-1">⭐ رصيد النقاط: <b>{p.points || 0}</b> (تُستبدل خصماً عند الدفع)</span>
        </div>
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-bold text-brand-900">📋 الشيت الطبي — زيارات مسجلة</h3>
          <Btn size="sm" onClick={() => setModal({ type: "encounter", data: { patientId: pid } })}>+ زيارة جديدة</Btn>
        </div>
        {encounters.length === 0 ? <Empty text="لا توجد زيارات مسجلة في الشيت الطبي بعد" /> : (
          <div className="space-y-2">
            {encounters.map((en) => {
              const diags = db.encounterDiagnoses.filter((x) => x.encounterId === en.id);
              const procs = db.encounterProcedures.filter((x) => x.encounterId === en.id);
              const docs = db.clinicalDocuments.filter((x) => x.encounterId === en.id);
              const spec = db.specialties.find((s) => s.id === en.specialtyId);
              return (
                <div key={en.id} className="bg-slate-50 rounded-xl p-3">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <p className="font-semibold text-sm">{en.date} · {h.dName(en.doctorId)} {spec && `· ${spec.name}`}</p>
                      {en.chiefComplaint && <p className="text-xs text-slate-600 mt-0.5">الشكوى: {en.chiefComplaint}</p>}
                      {en.assessment && <p className="text-xs text-slate-600 mt-0.5">التقييم: {en.assessment}</p>}
                      {diags.length > 0 && <p className="text-xs text-rose-600 mt-1">🩺 {diags.map((x) => x.diagnosis).join(" · ")}</p>}
                      {procs.length > 0 && <p className="text-xs text-brand-600 mt-1">🔧 {procs.map((x) => x.name).join(" · ")}</p>}
                      {docs.length > 0 && <p className="text-xs text-sky-600 mt-1">📎 {docs.length} مرفق</p>}
                    </div>
                    <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "encounter", data: { patientId: pid, edit: en } })}>فتح</Btn>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <Card className="p-4">
        <h3 className="font-display font-bold text-brand-900 mb-3">🦷 مخطط الأسنان التفاعلي</h3>
        <DentalChart patient={p} setModal={setModal} />
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-bold text-brand-900">🗺️ خطة العلاج (كل التخصصات)</h3>
          <Btn size="sm" onClick={() => setModal({ type: "plan", data: { patientId: pid } })}>+ إجراء</Btn>
        </div>
        {plans.length === 0 ? <Empty text="لا توجد خطة علاج بعد" /> : (
          <div className="space-y-2">
            {plans.map((pl) => (
              <div key={pl.id} className="bg-slate-50 rounded-xl p-3">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p className="font-semibold text-sm">{pl.procedure}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{pl.specialty} · {h.dName(pl.doctorId)} · {fmt(pl.price)}</p>
                    {pl.notes && <p className="text-xs text-slate-400 mt-0.5">{pl.notes}</p>}
                  </div>
                  <div className="flex flex-col items-end gap-1 shrink-0">
                    <button onClick={() => cyclePlan(pl)} className={`text-xs px-2 py-1 rounded-full font-semibold ${planTone[pl.status]}`}>{pl.status} ⟳</button>
                    {h.isOwner && <button onClick={() => {
                      if (!window.confirm("حذف هذا الإجراء من الخطة؟")) return;
                      update((d) => { d.plans = d.plans.filter((x) => x.id !== pl.id); return d; }, "حذف إجراء من خطة " + p.name + ": " + pl.procedure);
                    }} className="text-[10px] text-rose-500 hover:text-rose-700">حذف ✕</button>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-bold text-brand-900">🔬 التحاليل والأشعة والروشتات</h3>
          <Btn size="sm" onClick={() => setModal({ type: "record", data: { patientId: pid } })}>+ إضافة</Btn>
        </div>
        {(db.records || []).filter((r) => r.patientId === pid).length === 0 ? <Empty text="لا توجد سجلات طبية بعد" /> : (
          <div className="space-y-2">
            {(db.records || []).filter((r) => r.patientId === pid).sort((a, b) => b.date.localeCompare(a.date)).map((r) => {
              const icon = r.type === "تحليل" ? "🧪" : r.type === "أشعة" ? "🩻" : r.type === "روشتة" ? "💊" : "📄";
              return (
                <div key={r.id} className="bg-slate-50 rounded-xl p-3">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <p className="font-semibold text-sm">{icon} {r.title}</p>
                      <p className="text-xs text-slate-500 mt-0.5">{r.type} · {r.date} · {h.dName(r.doctorId)}</p>
                      {r.details && <p className="text-xs text-slate-600 mt-1 whitespace-pre-wrap">{r.details}</p>}
                      {r.link && <a href={r.link} target="_blank" rel="noreferrer" className="text-xs text-sky-600 underline mt-1 inline-block">📎 فتح المرفق</a>}
                    </div>
                    <div className="flex flex-col gap-1 shrink-0">
                      <button title="واتساب" onClick={() => window.open(waLink(p.phone, `${p.name} — ${r.type}: ${r.title}\n${r.details || ""}${r.link ? "\n" + r.link : ""}`), "_blank")} className="text-emerald-500 hover:text-emerald-700 text-sm">📤</button>
                      {h.isOwner && <button title="حذف" onClick={() => {
                        if (!window.confirm("حذف هذا السجل؟")) return;
                        update((d) => { d.records = d.records.filter((x) => x.id !== r.id); return d; }, "حذف سجل طبي: " + r.title);
                      }} className="text-rose-300 hover:text-rose-600 text-sm">🗑️</button>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <Card className="p-4">
        <h3 className="font-display font-bold text-brand-900 mb-3">🕓 سجل الزيارات والخدمات</h3>
        {visits.length === 0 ? <Empty text="لا توجد زيارات بعد" /> : (
          <div className="space-y-2">
            {visits.map((a) => {
              const sh = a.patientShare ?? a.price;
              const rem = Math.max(0, sh - a.paid);
              const dayRecords = (db.records || []).filter((r) => r.patientId === pid && r.date === a.date);
              return (
                <div key={a.id} className="border-b border-slate-100 pb-2.5">
                  <div className="flex justify-between items-start gap-2 text-sm">
                    <div className="min-w-0">
                      <p className="font-semibold">{a.service}</p>
                      <p className="text-xs text-slate-500">{a.date} {a.time} · {h.dName(a.doctorId)} · {a.status}</p>
                    </div>
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold shrink-0 ${a.status === "تم" ? "bg-emerald-100 text-emerald-700" : a.status === "ملغي" ? "bg-slate-200 text-slate-500" : "bg-sky-100 text-sky-700"}`}>{a.status}</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5 mt-1.5 text-[11px]">
                    <span className="bg-slate-100 rounded-lg px-2 py-0.5">السعر: {fmt(a.price)}</span>
                    {a.contractId && <span className="bg-violet-50 text-violet-700 rounded-lg px-2 py-0.5">📜 {h.cName(a.contractId)}</span>}
                    <span className="bg-brand-50 text-brand-700 rounded-lg px-2 py-0.5">على المريض: {fmt(sh)}</span>
                    <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-0.5">مدفوع: {fmt(a.paid)}</span>
                    {rem > 0 && <span className="bg-amber-50 text-amber-700 rounded-lg px-2 py-0.5">متبقي: {fmt(rem)}</span>}
                  </div>
                  {dayRecords.length > 0 && (
                    <p className="text-[11px] text-slate-500 mt-1">🔬 سجلات هذه الزيارة: {dayRecords.map((r) => r.title).join(" · ")}</p>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </>
  );
}

/* ---------- الماليات ---------- */
function Finance({ db, h, setModal, update }) {
  const [sub, setSub] = useState("summary");
  const totalIn = db.payments.reduce((s, p) => s + p.amount, 0);
  const totalOut = db.expenses.reduce((s, e) => s + e.amount, 0);
  const docShares = db.doctors.map((d) => {
    const collected = db.payments.filter((p) => p.doctorId === d.id).reduce((s, p) => s + p.amount, 0);
    return { ...d, collected, share: Math.round((collected * d.commission) / 100) };
  });
  const totalShares = docShares.reduce((s, d) => s + d.share, 0);
  const subs = [["summary", "الملخص"], ["in", "التحصيلات"], ["out", "المصروفات"], ["comm", "دخل الأطباء"]];

  return (
    <>
      <div className="flex gap-1.5 overflow-x-auto pb-1">
        {subs.map(([id, label]) => (
          <button key={id} onClick={() => setSub(id)}
            className={`px-3 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap ${sub === id ? "bg-brand-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{label}</button>
        ))}
      </div>
      {sub === "summary" && (
        <div className="grid grid-cols-2 gap-3">
          <Stat label="إجمالي التحصيلات" value={fmt(totalIn)} tone="emerald" />
          <Stat label="إجمالي المصروفات" value={fmt(totalOut)} tone="rose" />
          <Stat label="مستحقات الأطباء" value={fmt(totalShares)} tone="amber" />
          <Stat label="صافي العيادة" value={fmt(totalIn - totalOut - totalShares)} tone="teal" />
        </div>
      )}
      {sub === "in" && (
        <>
          {db.payments.length > 0 && (
            <Card className="p-4">
              <p className="text-xs font-bold text-slate-500 mb-2">التحصيلات حسب طريقة الدفع</p>
              <div className="flex flex-wrap gap-2">
                {PAYMENT_METHODS.filter((m) => db.payments.some((p) => (p.method || "كاش") === m)).map((m) => {
                  const total = db.payments.filter((p) => (p.method || "كاش") === m).reduce((s, p) => s + p.amount, 0);
                  return <span key={m} className="text-xs bg-brand-50 text-brand-700 rounded-lg px-2.5 py-1.5 font-semibold">{m}: {fmt(total)}</span>;
                })}
              </div>
            </Card>
          )}
          <Card className="p-4">
            {db.payments.length === 0 ? <Empty text="لا توجد تحصيلات" /> : (
              <div className="space-y-2">
                {[...db.payments].reverse().map((p) => (
                  <div key={p.id} className="flex justify-between items-center border-b border-slate-100 pb-2 text-sm">
                    <div>
                      <p className="font-semibold">{p.source === "جهة" ? `📜 ${p.note}` : h.pName(p.patientId)}</p>
                      <p className="text-xs text-slate-500">{p.date} · {h.dName(p.doctorId)} · {p.method || "كاش"}{p.currency && p.currency !== "EGP" ? ` (${p.foreignAmount} ${p.currency})` : ""}</p>
                    </div>
                    <span className="font-bold text-emerald-700">{fmt(p.amount)}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </>
      )}
      {sub === "out" && (
        <>
          <Btn onClick={() => setModal({ type: "expense" })}>+ مصروف جديد</Btn>
          <Card className="p-4">
            {db.expenses.length === 0 ? <Empty text="لا توجد مصروفات" /> : (
              <div className="space-y-2">
                {[...db.expenses].reverse().map((e) => (
                  <div key={e.id} className="flex justify-between items-center border-b border-slate-100 pb-2 text-sm">
                    <div><p className="font-semibold">{e.item}</p><p className="text-xs text-slate-500">{e.date} · {e.category}</p></div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-rose-600">{fmt(e.amount)}</span>
                      <button onClick={() => setModal({ type: "reason", data: {
                        title: "حذف مصروف: " + e.item, area: "الماليات", act: "حذف مصروف", item: e.item,
                        before: fmt(e.amount), after: "محذوف",
                        apply: (d) => { d.expenses = d.expenses.filter((x) => x.id !== e.id); return d; },
                      } })} className="text-rose-300 hover:text-rose-600 text-lg leading-none">✕</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </>
      )}
      {sub === "comm" && (
        <Card className="p-4">
          <h2 className="font-display font-bold text-brand-900 mb-3">دخل ونِسَب الأطباء</h2>
          <div className="space-y-3">
            {docShares.map((d) => (
              <div key={d.id} className="bg-brand-50/60 rounded-xl p-3">
                <div className="flex justify-between items-center">
                  <p className="font-semibold text-sm">{d.name} <span className="text-xs text-slate-500">({d.commission}%)</span></p>
                  <span className="font-bold text-brand-800">{fmt(d.share)}</span>
                </div>
                <p className="text-xs text-slate-500 mt-1">تحصيلات حالاته: {fmt(d.collected)}</p>
              </div>
            ))}
          </div>
        </Card>
      )}
    </>
  );
}

/* ---------- التقارير التحليلية ---------- */
function Reports({ db, h, update }) {
  const [repBranch, setRepBranch] = useState("");
  const monthKey = todayStr().slice(0, 7);
  const monthOverhead = db.overheadCosts.filter((c) => c.month === monthKey).reduce((s, c) => s + c.amount, 0);
  const overheadPerCase = monthlyOverheadPerCase(db, monthKey);
  const serviceCosts = db.services.filter((s) => s.active).map((s) => ({ ...s, ...computeServiceCost(db, s, overheadPerCase) }));
  const lossServices = serviceCosts.filter((s) => s.margin < 0);

  const weekAgo = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
  const weekRevenue = db.payments.filter((p) => p.date >= weekAgo).reduce((s, p) => s + p.amount, 0);
  const weekExpenses = db.expenses.filter((e) => e.date >= weekAgo).reduce((s, e) => s + e.amount, 0);
  const weekNet = weekRevenue - weekExpenses;

  const apptBranchOf = new Map(db.appointments.map((a) => [a.id, a.branchId]));
  const branchPayments = db.payments.filter((p) => !repBranch || apptBranchOf.get(p.apptId) === repBranch);
  const branchAppts = db.appointments.filter((a) => !repBranch || a.branchId === repBranch);

  const revByDoc = db.doctors.map((d) => ({
    label: d.name,
    value: branchPayments.filter((p) => p.doctorId === d.id).reduce((s, p) => s + p.amount, 0),
  }));
  const maxDoc = Math.max(...revByDoc.map((x) => x.value), 1);

  const svcMap = {};
  branchAppts.filter((a) => a.status !== "ملغي").forEach((a) => {
    svcMap[a.service] = (svcMap[a.service] || 0) + a.price;
  });
  const topSvcs = Object.entries(svcMap).map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value).slice(0, 5);
  const maxSvc = Math.max(...topSvcs.map((x) => x.value), 1);

  const males = db.patients.filter((p) => p.gender === "ذكر").length;
  const females = db.patients.filter((p) => p.gender === "أنثى").length;
  const ages = db.patients.filter((p) => p.age).map((p) => p.age);
  const avgAge = ages.length ? Math.round(ages.reduce((s, a) => s + a, 0) / ages.length) : 0;
  const noShow = db.appointments.filter((a) => a.status === "ملغي").length;
  const done = db.appointments.filter((a) => a.status === "تم").length;

  return (
    <>
      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-3">📅 تقرير آخر 7 أيام</h2>
        <div className="grid grid-cols-3 gap-3">
          <Stat label="تحصيلات" value={fmt(weekRevenue)} tone="emerald" />
          <Stat label="مصاريف" value={fmt(weekExpenses)} tone="rose" />
          <Stat label="الصافي" value={fmt(weekNet)} tone={weekNet >= 0 ? "emerald" : "rose"} />
        </div>
      </Card>

      {lossServices.length > 0 && (
        <Card className="p-4 border-2 border-rose-300 bg-rose-50">
          <h2 className="font-bold text-rose-800 mb-2">🚨 تنبيه خسارة — خدمات سعرها أقل من تكلفتها الحقيقية</h2>
          <div className="space-y-1">
            {lossServices.map((s) => (
              <p key={s.id} className="text-xs text-rose-700">
                <b>{s.name}</b>: السعر {fmt(s.price)} — التكلفة {fmt(Math.round(s.totalCost))} — خسارة {fmt(Math.round(-s.margin))} في الحالة
              </p>
            ))}
          </div>
        </Card>
      )}

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-display font-bold text-brand-900">💵 التكلفة الحقيقية للخدمات وهامش الربح</h2>
        </div>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <Field label="عدد الحالات المتوقعة شهريًا">
            <input type="number" className={inputCls} value={db.overheadSettings.expectedCases} disabled={!h.isOwner}
              onChange={(e) => update((d) => { d.overheadSettings = { ...d.overheadSettings, expectedCases: Number(e.target.value) || 0 }; recomputeAutoPricedServices(d); return d; })} />
          </Field>
          <Field label="هامش الربح المستهدف (%)">
            <input type="number" className={inputCls} value={db.overheadSettings.targetMarginPct} disabled={!h.isOwner}
              onChange={(e) => update((d) => { d.overheadSettings = { ...d.overheadSettings, targetMarginPct: Number(e.target.value) || 0 }; recomputeAutoPricedServices(d); return d; })} />
          </Field>
        </div>
        <p className="text-xs text-slate-500 mb-3">مصاريف {monthKey} الثابتة: <b>{fmt(monthOverhead)}</b> ÷ {db.overheadSettings.expectedCases} حالة متوقعة = <b>{fmt(Math.round(overheadPerCase))}</b> نصيب كل حالة من المصاريف الثابتة</p>
        {serviceCosts.length === 0 ? <Empty text="لا توجد خدمات مُعرّفة بعد — أضفها من الحسابات أولاً" /> : (
          <div className="space-y-4">
            {Object.entries(
              serviceCosts.reduce((groups, s) => {
                const key = (db.specialties.find((sp) => sp.id === s.specialtyId) || {}).name || "عام";
                (groups[key] = groups[key] || []).push(s);
                return groups;
              }, {})
            ).map(([specName, items]) => (
              <div key={specName}>
                {db.specialties.length > 1 && <p className="text-xs font-bold text-brand-700 mb-1.5">🩺 {specName}</p>}
                <div className="space-y-2">
                  {items.map((s) => (
                    <div key={s.id} className={`rounded-xl p-3 border ${s.marginPct >= db.overheadSettings.targetMarginPct ? "bg-emerald-50 border-emerald-200" : s.margin >= 0 ? "bg-amber-50 border-amber-200" : "bg-rose-50 border-rose-200"}`}>
                      <div className="flex justify-between items-center">
                        <p className="font-semibold text-sm">{s.name}</p>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${s.marginPct >= db.overheadSettings.targetMarginPct ? "bg-emerald-600 text-white" : s.margin >= 0 ? "bg-amber-500 text-white" : "bg-rose-600 text-white"}`}>هامش {s.marginPct}%</span>
                      </div>
                      <div className="flex flex-wrap gap-2 mt-2 text-[11px]">
                        <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">السعر: <b>{fmt(s.price)}</b></span>
                        <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">مستهلكات: <b>{fmt(Math.round(s.consumablesCost))}</b></span>
                        <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">نصيب المصاريف الثابتة: <b>{fmt(Math.round(overheadPerCase))}</b></span>
                        <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">التكلفة الكلية: <b>{fmt(Math.round(s.totalCost))}</b></span>
                        <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">صافي الربح: <b>{fmt(Math.round(s.margin))}</b></span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      {db.branches.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setRepBranch("")}
            className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${repBranch === "" ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>كل الفروع</button>
          {db.branches.map((b) => (
            <button key={b.id} onClick={() => setRepBranch(b.id)}
              className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${repBranch === b.id ? "bg-violet-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>🏢 {b.name}</button>
          ))}
        </div>
      )}

      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-3">📊 دخل الأطباء (تحصيلات الحالات){repBranch && ` — ${db.branches.find((b) => b.id === repBranch)?.name}`}</h2>
        <div className="space-y-3">{revByDoc.map((x) => <Bar key={x.label} {...x} max={maxDoc} />)}</div>
      </Card>

      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-3">🏆 أعلى الخدمات قيمةً{repBranch && ` — ${db.branches.find((b) => b.id === repBranch)?.name}`}</h2>
        {topSvcs.length === 0 ? <Empty text="لا توجد بيانات بعد" /> :
          <div className="space-y-3">{topSvcs.map((x) => <Bar key={x.label} {...x} max={maxSvc} />)}</div>}
      </Card>

      <Card className="p-4">
        <h2 className="font-display font-bold text-brand-900 mb-3">🧑‍🤝‍🧑 ديموغرافيا المرضى</h2>
        <div className="grid grid-cols-2 gap-3">
          <Stat label="ذكور / إناث" value={`${males} / ${females}`} />
          <Stat label="متوسط العمر" value={avgAge ? `${avgAge} سنة` : "—"} tone="violet" />
          <Stat label="كشوفات مكتملة" value={done} tone="emerald" />
          <Stat label="مواعيد ملغاة" value={noShow} tone="rose" />
        </div>
      </Card>
    </>
  );
}

/* ---------- التعاقدات ---------- */
function Contracts({ db, h, update, setModal }) {
  const claims = db.appointments.filter((a) => a.entityShare > 0 && a.status !== "ملغي");
  const byContract = db.contracts.map((c) => {
    const open = claims.filter((a) => a.contractId === c.id && !a.entityPaid);
    return { ...c, openTotal: open.reduce((s, a) => s + a.entityShare, 0) };
  });
  const collectEntity = (a) =>
    update((d) => {
      const appt = d.appointments.find((x) => x.id === a.id);
      appt.entityPaid = true;
      d.payments.push({ id: uid(), date: todayStr(), patientId: a.patientId, doctorId: a.doctorId, apptId: a.id, amount: a.entityShare, note: h.cName(a.contractId), source: "جهة", branchId: a.branchId, method: "تحويل بنكي" });
      return d;
    }, `تحصيل ${fmt(a.entityShare)} من ${h.cName(a.contractId)}`);

  return (
    <>
      <div className="flex justify-between items-center">
        <h2 className="font-display font-bold text-brand-900">النقابات والجهات</h2>
        <Btn size="sm" onClick={() => setModal({ type: "contract" })}>+ تعاقد جديد</Btn>
      </div>
      <div className="space-y-2">
        {byContract.map((c) => (
          <Card key={c.id} className="p-4">
            <div className="flex justify-between items-start">
              <div>
                <p className="font-bold">📜 {c.name}</p>
                <p className="text-xs text-slate-500 mt-0.5">خصم {c.discount}% · المريض يتحمل {c.patientPct}% والجهة {100 - c.patientPct}%</p>
                {c.terms && <p className="text-xs text-slate-400 mt-0.5">شروط: {c.terms}</p>}
              </div>
              <div className="flex flex-col items-end gap-1.5 shrink-0">
                <span className="bg-violet-50 text-violet-700 text-xs font-bold rounded-lg px-2 py-1">مستحق: {fmt(c.openTotal)}</span>
                <div className="flex gap-1.5">
                  <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "contract", data: { edit: c } })}>تعديل</Btn>
                  {h.isOwner && (
                    <Btn size="sm" tone="rose" onClick={() => {
                      if (!window.confirm("إنهاء وحذف التعاقد مع " + c.name + "؟")) return;
                      update((d) => { d.contracts = d.contracts.filter((x) => x.id !== c.id); return d; }, "حذف تعاقد: " + c.name);
                    }}>حذف</Btn>
                  )}
                </div>
              </div>
            </div>
          </Card>
        ))}
        {db.contracts.length === 0 && <Card className="p-4"><Empty text="لا توجد تعاقدات" /></Card>}
      </div>
      <Card className="p-4">
        <h3 className="font-display font-bold text-brand-900 mb-3">💼 مطالبات مفتوحة</h3>
        {claims.filter((a) => !a.entityPaid).length === 0 ? <Empty text="لا توجد مطالبات مفتوحة ✅" /> : (
          <div className="space-y-2">
            {claims.filter((a) => !a.entityPaid).map((a) => (
              <div key={a.id} className="flex justify-between items-center bg-violet-50/60 rounded-xl p-3 text-sm">
                <div>
                  <p className="font-semibold">{h.pName(a.patientId)} — {a.service}</p>
                  <p className="text-xs text-slate-500">{a.date} · {h.cName(a.contractId)}</p>
                </div>
                <div className="text-left">
                  <p className="font-bold text-violet-700 mb-1">{fmt(a.entityShare)}</p>
                  {(h.isOwner || h.can("collect")) ? <Btn size="sm" tone="violet" onClick={() => collectEntity(a)}>تم التحصيل</Btn>
                    : <p className="text-[10px] text-slate-400">محتاج صلاحية "التحصيل" كمان</p>}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </>
  );
}

/* ---------- المعمل ---------- */
function Lab({ db, h, update, setModal }) {
  const cycle = (c) =>
    update((d) => {
      const x = d.labCases.find((y) => y.id === c.id);
      x.status = x.status === "بالمعمل" ? "وصلت" : x.status === "وصلت" ? "تم التركيب" : "بالمعمل";
      return d;
    }, `تحديث حالة معمل: ${c.work} — ${h.pName(c.patientId)}`);
  const payLab = (c) =>
    update((d) => {
      d.labCases.find((x) => x.id === c.id).paidToLab = true;
      d.expenses.push({ id: uid(), date: todayStr(), item: `معمل: ${c.labName} — ${c.work}`, category: "معمل", amount: c.cost });
      return d;
    }, `دفع ${fmt(c.cost)} لمعمل ${c.labName}`);
  const tone = { "بالمعمل": "bg-amber-100 text-amber-700", "وصلت": "bg-sky-100 text-sky-700", "تم التركيب": "bg-emerald-100 text-emerald-700" };

  return (
    <>
      <div className="flex justify-between items-center">
        <h2 className="font-display font-bold text-brand-900">🦷 حالات المعمل</h2>
        <Btn size="sm" onClick={() => setModal({ type: "lab" })}>+ حالة معمل</Btn>
      </div>
      <div className="space-y-2">
        {db.labCases.length === 0 && <Card className="p-4"><Empty text="لا توجد حالات معمل" /></Card>}
        {db.labCases.map((c) => (
          <Card key={c.id} className="p-4">
            <div className="flex justify-between items-start gap-2">
              <div>
                <p className="font-bold text-sm">{c.work} — {h.pName(c.patientId)}</p>
                <p className="text-xs text-slate-500 mt-0.5">{c.labName} · {h.dName(c.doctorId)} · أُرسلت {c.dateSent}</p>
                <p className="text-xs text-slate-500 mt-0.5">التكلفة: <b>{fmt(c.cost)}</b> {c.paidToLab ? "✓ مدفوعة" : ""}</p>
              </div>
              <button onClick={() => cycle(c)} className={`text-xs px-2 py-1 rounded-full font-semibold ${tone[c.status]}`}>{c.status} ⟳</button>
            </div>
            <div className="flex gap-2 mt-2">
              {!c.paidToLab && h.isOwner && <Btn size="sm" tone="rose" onClick={() => payLab(c)}>دفع للمعمل</Btn>}
              {h.isOwner && (
                <Btn size="sm" tone="ghost" onClick={() => {
                  if (!window.confirm("حذف حالة المعمل نهائياً؟")) return;
                  update((d) => { d.labCases = d.labCases.filter((x) => x.id !== c.id); return d; }, "حذف حالة معمل: " + c.work);
                }}>حذف</Btn>
              )}
            </div>
          </Card>
        ))}
      </div>
    </>
  );
}

/* ---------- الموظفون ---------- */
function Staff({ db, update, setModal, h }) {
  const canFinance = h.isOwner; // مكافآت/خصومات/صرف المرتب برة نطاق صلاحية HR — ليها صلاحية "payroll" منفصلة أصلاً
  const t = todayStr();
  const recOf = (empId) => db.attendance.find((r) => r.empId === empId && r.date === t);
  const checkIn = (e) => update((d) => { d.attendance.push({ id: uid(), empId: e.id, date: t, in: nowTime(), out: null }); return d; }, `تسجيل حضور ${e.name}`);
  const checkOut = (e) => update((d) => { const r = d.attendance.find((x) => x.empId === e.id && x.date === t && !x.out); if (r) r.out = nowTime(); return d; }, `تسجيل انصراف ${e.name}`);
  const txOf = (empId) => db.payrollTx.filter((x) => x.empId === empId && !x.settled);
  const netOf = (e) => {
    const tx = txOf(e.id);
    const bonus = tx.filter((x) => x.type === "مكافأة").reduce((s, x) => s + x.amount, 0);
    const cuts = tx.filter((x) => x.type !== "مكافأة").reduce((s, x) => s + x.amount, 0);
    return { bonus, cuts, net: e.salary + bonus - cuts };
  };
  const paySalary = (e) => {
    const { net } = netOf(e);
    update((d) => {
      d.payrollTx.forEach((x) => { if (x.empId === e.id) x.settled = true; });
      d.expenses.push({ id: uid(), date: todayStr(), item: `راتب ${e.name}`, category: "رواتب", amount: net });
      return d;
    }, `صرف راتب ${e.name} — صافي ${fmt(net)}`);
  };

  return (
    <>
      <div className="flex justify-between items-center">
        <h2 className="font-display font-bold text-brand-900">الموظفون والمرتبات</h2>
        <Btn size="sm" onClick={() => setModal({ type: "employee" })}>+ موظف</Btn>
      </div>
      <div className="space-y-3">
        {db.employees.map((e) => {
          const r = recOf(e.id);
          const { bonus, cuts, net } = netOf(e);
          const tx = txOf(e.id);
          return (
            <Card key={e.id} className="p-4">
              <div className="flex items-center gap-3">
                <div className="flex-1">
                  <p className="font-semibold">{e.name} <span className="text-xs text-slate-500">· {e.role}</span>
                    {db.branches.length > 0 && <span className="text-[10px] bg-violet-50 text-violet-700 rounded-full px-2 py-0.5">🏢 {primaryBranchOf(db, e.id)?.name || "بدون فرع"}</span>}</p>
                  {r ? <p className="text-xs mt-0.5"><span className="text-emerald-600">حضور {r.in}</span>{r.out && <span className="text-rose-600"> · انصراف {r.out}</span>}
                      {r.inMethod === "gps" && <span className="text-[10px] bg-emerald-50 text-emerald-700 rounded-full px-1.5 py-0.5 mr-1">📍 موقع مؤكد</span>}
                      {r.manualOverride && <span title={r.overrideReason} className="text-[10px] bg-amber-50 text-amber-700 rounded-full px-1.5 py-0.5 mr-1">✍️ يدوي</span>}</p>
                    : <p className="text-xs text-slate-400 mt-0.5">لم يسجل حضور اليوم</p>}
                </div>
                {!r ? <Btn size="sm" tone="emerald" onClick={() => checkIn(e)}>حضور</Btn>
                  : !r.out ? <Btn size="sm" tone="rose" onClick={() => checkOut(e)}>انصراف</Btn>
                  : <span className="text-xs text-slate-400">✓</span>}
              </div>
              <div className="bg-slate-50 rounded-xl p-3 mt-3">
                <div className="flex flex-wrap gap-2 text-xs">
                  <span className="bg-white rounded-lg px-2 py-1 border border-slate-200">الأساسي: <b>{fmt(e.salary)}</b></span>
                  {canFinance && bonus > 0 && <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-1">مكافآت: +{fmt(bonus)}</span>}
                  {canFinance && cuts > 0 && <span className="bg-rose-50 text-rose-700 rounded-lg px-2 py-1">خصم/سلف: −{fmt(cuts)}</span>}
                  {canFinance && <span className="bg-brand-700 text-white rounded-lg px-2 py-1">الصافي: <b>{fmt(net)}</b></span>}
                </div>
                {canFinance && tx.length > 0 && (
                  <div className="mt-2 space-y-1">
                    {tx.map((x) => (
                      <p key={x.id} className="text-[11px] text-slate-500 flex items-center gap-1.5">
                        <span>• {x.type} {fmt(x.amount)} — {x.date} {x.note && `(${x.note})`}</span>
                        <button onClick={() => {
                          if (!window.confirm("حذف هذه الحركة؟")) return;
                          update((d) => { d.payrollTx = d.payrollTx.filter((y) => y.id !== x.id); return d; }, "حذف حركة " + x.type + " لـ" + e.name);
                        }} className="text-rose-400 hover:text-rose-600">✕</button>
                      </p>
                    ))}
                  </div>
                )}
                <div className="flex gap-2 mt-2">
                  {canFinance && <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "payrollTx", data: e })}>+ مكافأة / خصم / سلفة</Btn>}
                  {db.branches.length > 0 && <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "memberBranch", data: { memberId: e.id, name: e.name } })}>الفرع</Btn>}
                  <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "employee", data: { edit: e } })}>تعديل</Btn>
                  <Btn size="sm" tone="rose" onClick={() => {
                    if (!window.confirm("حذف الموظف " + e.name + " وكل سجلات حضوره وحركات مرتبه؟")) return;
                    update((d) => {
                      d.employees = d.employees.filter((x) => x.id !== e.id);
                      d.attendance = d.attendance.filter((x) => x.empId !== e.id);
                      d.payrollTx = d.payrollTx.filter((x) => x.empId !== e.id);
                      return d;
                    }, "حذف الموظف: " + e.name);
                  }}>حذف</Btn>
                  {canFinance && <Btn size="sm" tone="amber" onClick={() => paySalary(e)}>صرف المرتب</Btn>}
                </div>
              </div>
            </Card>
          );
        })}
      </div>
      {!h.isOwner && h.can("hr") && <RosterCatalogs db={db} update={update} setModal={setModal} />}
    </>
  );
}

/* ---------- الأطباء والوظائف والتخصصات (لموظف HR مُفوَّض — بدون صلاحية تعديل مصفوفة الصلاحيات نفسها) ---------- */
function RosterCatalogs({ db, update, setModal }) {
  return (
    <>
      <div className="flex justify-between items-center mt-6">
        <h2 className="font-display font-bold text-brand-900">حسابات الأطباء</h2>
        <Btn size="sm" onClick={() => setModal({ type: "doctor" })}>+ طبيب</Btn>
      </div>
      <div className="space-y-2">
        {[...db.doctors].sort((a, b) => (a.specialty || "").localeCompare(b.specialty || "")).map((d) => {
          const branch = primaryBranchOf(db, d.id);
          return (
            <Card key={d.id} className="p-4 flex items-center gap-3">
              <div className="flex-1">
                <p className="font-semibold">{d.name} <span className="text-[10px] bg-brand-50 text-brand-700 rounded-full px-2 py-0.5">{d.specialty || "عام"}</span>
                  {db.branches.length > 0 && <span className="text-[10px] bg-violet-50 text-violet-700 rounded-full px-2 py-0.5">🏢 {branch ? branch.name : "بدون فرع"}</span>}</p>

              </div>
              {db.branches.length > 0 && <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "memberBranch", data: { memberId: d.id, name: d.name } })}>الفرع</Btn>}
              <Btn size="sm" tone="ghost" onClick={() => setModal({ type: "doctor", data: { edit: d } })}>تعديل</Btn>
              <Btn size="sm" tone="rose" onClick={() => {

                update((x) => { x.doctors = x.doctors.filter((y) => y.id !== d.id); return x; }, "حذف حساب الطبيب: " + d.name);

      <div className="flex justify-between items-center mt-6">
        <h2 className="font-display font-bold text-brand-900">التخصصات الطبية</h2>
        <Btn size="sm" onClick={() => setModal({ type: "specialty" })}>+ تخصص</Btn>
      </div>
      <Card className="p-3">
        {db.specialties.length === 0 ? <Empty text="لا توجد تخصصات — أضف تخصصات هنا قبل إضافة الأطباء" /> : (
          <div className="flex flex-wrap gap-2">
            {db.specialties.map((s) => (
              <span key={s.id} className={`flex items-center gap-1.5 text-xs rounded-full px-3 py-1.5 border ${s.active ? "bg-brand-50 border-brand-200 text-brand-800" : "bg-slate-50 border-slate-200 text-slate-400"}`}>
                {s.name}
                <button onClick={() => setModal({ type: "specialty", data: { edit: s } })} className="hover:text-brand-900">✏️</button>
                <button onClick={() => {
                  if (!window.confirm(`حذف تخصص "${s.name}"؟`)) return;
                  update((d) => { d.specialties = d.specialties.filter((x) => x.id !== s.id); return d; }, "حذف تخصص: " + s.name);
                }} className="hover:text-rose-600">✕</button>
              </span>
            ))}
          </div>
        )}

      <div className="flex justify-between items-center mt-6">
        <h2 className="font-display font-bold text-brand-900">الوظائف (للموظفين)</h2>
        <Btn size="sm" onClick={() => setModal({ type: "jobTitle" })}>+ وظيفة</Btn>
      </div>
      <Card className="p-3">
        {db.jobTitles.length === 0 ? <Empty text="لا توجد وظائف — أضف وظائف هنا قبل إضافة الموظفين" /> : (
          <div className="flex flex-wrap gap-2">
            {db.jobTitles.map((j) => (
              <span key={j.id} className={`flex items-center gap-1.5 text-xs rounded-full px-3 py-1.5 border ${j.active ? "bg-violet-50 border-violet-200 text-violet-800" : "bg-slate-50 border-slate-200 text-slate-400"}`}>
                {j.name}
                <button onClick={() => setModal({ type: "jobTitle", data: { edit: j } })} className="hover:text-violet-900">✏️</button>
                <button onClick={() => {

                  update((d) => { d.jobTitles = d.jobTitles.filter((x) => x.id !== j.id); return d; }, "حذف وظيفة: " + j.name);

        <p className="text-[11px] text-slate-400 mt-2">تحديد صلاحيات كل وظيفة (🔑) من اختصاص صاحب العيادة فقط.</p>
