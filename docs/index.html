    if (e.target && (e.target.src || e.target.href)) {

      showErr((e.message || 'خطأ غير معروف') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
    }

  window.addEventListener('unhandledrejection', function (e) {

/* محرك المزامنة: يقارن الحالة قبل/بعد ويرسل الفروق للقاعدة */
let syncBusy = false, lastPush = 0, subCb = null, rtTimer = null, memberRef = null;

/* قائمة انتظار العمل بدون اتصال: أي تعديل يفشل بسبب انقطاع الشبكة (مش رفض من القاعدة) بيتخزن هنا ويتبعت أوتوماتيك لما النت يرجع */
const OFFLINE_QUEUE_KEY = "clinicOfflineQueue";
let offlineQueueListeners = [];
const getOfflineQueue = () => { try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]"); } catch { return []; } };
const setOfflineQueue = (q) => {
  try { localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); } catch (e) { console.warn("تعذر حفظ قائمة الانتظار", e); }
  offlineQueueListeners.forEach((cb) => cb(q.length));
};
const subscribeOfflineQueue = (cb) => {
  offlineQueueListeners.push(cb);
  cb(getOfflineQueue().length);
  return () => { offlineQueueListeners = offlineQueueListeners.filter((x) => x !== cb); };
};
const queueOfflineOp = (op) => { const q = getOfflineQueue(); q.push(op); setOfflineQueue(q); };

/* آخر نسخة ناجحة من بيانات العيادة — تتحمّل لو الإنترنت مقطوع وقت الدخول أو التحميل */
const OFFLINE_SNAPSHOT_KEY = "clinicOfflineSnapshot";
const saveOfflineSnapshot = (userId, member, db0) => {
  try { localStorage.setItem(OFFLINE_SNAPSHOT_KEY, JSON.stringify({ userId, member, db0, savedAt: Date.now() })); }
  catch (e) { console.warn("تعذر حفظ نسخة للعمل بدون اتصال", e); }
};
const loadOfflineSnapshot = (userId) => {
  try {
    const raw = localStorage.getItem(OFFLINE_SNAPSHOT_KEY);
    if (!raw) return null;
    const snap = JSON.parse(raw);
    return snap && snap.userId === userId ? snap : null;
  } catch { return null; }
};

const runOp = (op) => {
  const q = sb.from(op.table);
  if (op.method === "insert") return q.insert(op.payload);
  if (op.method === "update") return q.update(op.payload).eq("id", op.id);
  if (op.method === "delete") return q.delete().eq("id", op.id);
  if (op.method === "upsert") return q.upsert(op.payload, op.opts);
  return Promise.resolve({ error: { message: "عملية غير معروفة" } });
};

let flushingOffline = false;
async function flushOfflineQueue() {
  if (flushingOffline) return;
  const q = getOfflineQueue();
  if (!q.length) return;
  flushingOffline = true;
  const remaining = [];
  for (const op of q) {
    try {
      const r = await runOp(op);
      if (r && r.error) {
        console.error(r.error);
        alert("⚠️ تعذر حفظ تعديل كان قيد الانتظار: " + (r.error.message || ""));
      }
    } catch (e) {
      remaining.push(op); // لسه من غير اتصال — يفضل في الانتظار
    }
  }
  setOfflineQueue(remaining);
  flushingOffline = false;
}
if (typeof window !== "undefined") window.addEventListener("online", () => flushOfflineQueue());

async function pushDiff(prev, next) {
  const ops = [];
  for (const key of Object.keys(COLS)) {
    const c = COLS[key];
    const pm = new Map((prev[key] || []).map((o) => [o.id, o]));
    const nm = new Map((next[key] || []).map((o) => [o.id, o]));
    for (const [id, o] of nm) {
      if (!pm.has(id)) ops.push({ table: c.table, method: "insert", payload: c.to(o) });
      else if (JSON.stringify(pm.get(id)) !== JSON.stringify(o)) ops.push({ table: c.table, method: "update", payload: c.to(o), id });
    }
    for (const id of pm.keys()) if (!nm.has(id)) ops.push({ table: c.table, method: "delete", id });
  }
  const plm = new Set((prev.logs || []).map((x) => x.id));
  for (const l of (next.logs || [])) {
    if (plm.has(l.id)) continue;
    const f = (next.auditFlags || []).find((a) => a.id === l.id);
    ops.push({ table: "audit_logs", method: "insert", payload: {
      id: l.id, clinic_id: CID, user_name: l.user,
      area: f ? f.area : "", action: f ? f.act : l.action, item: f ? f.item : "",
      before_val: f ? f.before : "", after_val: f ? f.after : "",
      reason: f ? f.reason : "", sensitive: !!l.sensitive,
    } });
  }
  if (next.clinicName !== prev.clinicName) ops.push({ table: "clinics", method: "update", payload: { name: next.clinicName }, id: CID });
  if (JSON.stringify(next.overheadSettings) !== JSON.stringify(prev.overheadSettings)) {
    ops.push({ table: "overhead_allocation_settings", method: "upsert", payload: {
      clinic_id: CID,
      expected_monthly_cases: next.overheadSettings.expectedCases,
      target_margin_pct: next.overheadSettings.targetMarginPct,
    }, opts: { onConflict: "clinic_id" } });
  }
  if (!ops.length) return;
  syncBusy = true;
  try {
    for (const op of ops) {
      try {
        const r = await runOp(op);
        if (r && r.error) {
          console.error(r.error);
          alert("⚠️ تعذر حفظ التعديل: " + (r.error.message || "") + "\nغالباً ليست لديك صلاحية لهذه العملية — والحماية هنا من قاعدة البيانات نفسها.");
        }
      } catch (networkErr) {
        queueOfflineOp(op);
      }
    }
  } finally {
    syncBusy = false;
    lastPush = Date.now();
  }
}

function subscribeRealtime() {
  sb.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      if (syncBusy || Date.now() - lastPush < 1500) return;
      clearTimeout(rtTimer);
      rtTimer = setTimeout(async () => {
        try {
          const d = await loadAll(memberRef);
          if (memberRef.userId) saveOfflineSnapshot(memberRef.userId, memberRef, d);
          if (subCb) subCb(d);
        } catch (e) { console.error(e); }
      }, 800);
    })
    .subscribe();
}

function PatientAuth({ onStaff }) {
  const [mode, setMode] = useState("login"); // login | signup
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [pass2, setPass2] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const go = async () => {
    setMsg(null);
    if (!email.trim() || pass.length < 6) { setMsg({ type: "err", text: "اكتب إيميل صحيح وكلمة سر 6 حروف على الأقل" }); return; }
    if (mode === "signup") {
      if (!name.trim()) { setMsg({ type: "err", text: "اكتب اسمك" }); return; }
      if (pass !== pass2) { setMsg({ type: "err", text: "كلمة السر وتأكيدها مش متطابقين" }); return; }
    }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pass, options: { data: { name: name.trim(), kind: "patient" } } });
        if (error) throw error;
        if (data.session) {
          const { error: perr } = await sb.from("patients").insert({ auth_id: data.user.id, name: name.trim(), phone: phone.trim() || null, email: email.trim() });
          if (perr) throw perr;
          location.reload();
          return;
        }
        setMsg({ type: "ok", text: "✅ تم إنشاء الحساب! افتح إيميلك واضغط رابط التأكيد، وبعدها ارجع هنا وسجّل دخول." });
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (error) throw error;
      }
    } catch (e) {
      const t = (e.message || "").includes("Invalid login") ? "الإيميل أو كلمة السر غير صحيحة"
        : (e.message || "").includes("already registered") ? "الإيميل ده مسجل قبل كده — سجّل دخول"
        : "خطأ: " + (e.message || e);
      setMsg({ type: "err", text: t });
    } finally { setBusy(false); }
  };

  return (
    <div dir="rtl" className="min-h-screen flex items-center justify-center p-4" style={{ background: "radial-gradient(130% 85% at 50% -8%, #145F66 0%, #0D3B41 52%, #071F22 100%)" }}>
      <div className="bg-white rounded-3xl w-full max-w-sm shadow-xl overflow-hidden">
        <div className="h-1" style={{ background: "linear-gradient(90deg, #E7C9C1, #C98B7A 45%, #9C5C4B 85%)" }} />
        <div className="p-6">
        <div className="flex flex-col items-center gap-3 mb-1">
          <div className="w-14 h-14 rounded-full flex items-center justify-center" style={{ background: "#F3E2DC" }}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9C5C4B" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 3.2c-2 0-3 .9-4.4.9-1.7 0-3.3-1.2-4.3-.2C2.2 4.9 2.4 6.9 2.8 9c.4 2.3 1 5.5 2 7.9.6 1.4 1.3 2.5 2.3 2.5 1.4 0 1.2-3.1 2.1-5.2.4-1 .8-1.6 1-1.6s.5.6.9 1.6c.9 2.1.7 5.2 2.1 5.2 1 0 1.7-1.1 2.3-2.5.9-2.3 1.6-5.5 2-7.9.4-2.1.5-4.1-.6-5.1-1-.9-2.5.2-4.1.2-1.4 0-2.4-.9-4.4-.9Z" />
            </svg>
          </div>
          <h1 className="font-brand text-2xl text-brand-900 text-center">أهلاً بيك في عيادتي</h1>
        </div>
        <p className="text-xs text-slate-500 text-center mt-1 mb-5">
          {mode === "login" ? "سجّل دخولك بإيميلك وكلمة السر" : "اعمل حسابك عشان تتابع مواعيدك"}
        </p>
        {mode === "signup" && (
          <>
            <input className={loginInput + " mb-2"} placeholder="اسمك بالكامل" value={name} onChange={(e) => setName(e.target.value)} />
            <input dir="ltr" className={loginInput + " mb-2"} placeholder="رقم الموبايل (اختياري)" value={phone} onChange={(e) => setPhone(e.target.value)} />
          </>
        )}
        <input dir="ltr" type="email" className={loginInput + " mb-2"} placeholder="الإيميل" value={email} onChange={(e) => setEmail(e.target.value)} />
        <input dir="ltr" type="password" className={loginInput + (mode === "signup" ? " mb-2" : "")} placeholder="كلمة السر (6+ حروف)" value={pass}
          onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => e.key === "Enter" && mode === "login" && go()} />
        {mode === "signup" && (
          <input dir="ltr" type="password" className={loginInput} placeholder="تأكيد كلمة السر" value={pass2}
            onChange={(e) => setPass2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} />
        )}
        {msg && <p className={"text-xs mt-2 text-center " + (msg.type === "err" ? "text-rose-600" : "text-emerald-600")}>{msg.text}</p>}
        <button disabled={busy} onClick={go}
          className="w-full mt-3 bg-brand-700 hover:bg-brand-800 text-white rounded-xl py-2.5 font-bold text-sm">
          {busy ? "لحظة…" : mode === "login" ? "دخول" : "إنشاء الحساب"}
        </button>
        <button onClick={() => { setMode(mode === "login" ? "signup" : "login"); setMsg(null); }}
          className="w-full mt-2 text-brand-700 text-xs font-semibold">
          {mode === "login" ? "أول مرة؟ اعمل حساب" : "عندك حساب؟ سجّل دخول"}
        </button>
        {onStaff && (
          <button onClick={onStaff} className="w-full mt-3 pt-3 border-t border-slate-100 text-xs text-slate-500">
            طبيب أو موظف؟ <span className="text-brand-700 font-semibold">سجّل دخولك من هنا</span>
          </button>
        )}
        </div>
      </div>
    </div>
  );
}

function SetNewPassword({ onDone }) {
  const [pass, setPass] = useState("");
  const [pass2, setPass2] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const save = async () => {
    setMsg(null);
    if (pass.length < 6) { setMsg({ type: "err", text: "كلمة السر لازم تكون 6 حروف على الأقل" }); return; }
    if (pass !== pass2) { setMsg({ type: "err", text: "كلمة السر وتأكيدها مش متطابقين" }); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: pass });
      if (error) throw error;
      setMsg({ type: "ok", text: "✅ اتغيّرت كلمة السر بنجاح" });
      setTimeout(onDone, 1200);
    } catch (e) {
      setMsg({ type: "err", text: "خطأ: " + (e.message || e) });
    } finally { setBusy(false); }
  };

  return (
    <div dir="rtl" className="min-h-screen flex items-center justify-center p-4" style={{ background: "radial-gradient(130% 85% at 50% -8%, #145F66 0%, #0D3B41 52%, #071F22 100%)" }}>
      <div className="bg-white rounded-3xl w-full max-w-sm shadow-xl overflow-hidden">
        <div className="h-1" style={{ background: "linear-gradient(90deg, #E7C9C1, #C98B7A 45%, #9C5C4B 85%)" }} />
        <div className="p-6">
        <h1 className="font-brand text-2xl text-brand-900 text-center">🔑 كلمة سر جديدة</h1>
        <p className="text-xs text-slate-500 text-center mt-1 mb-5">اكتب كلمة السر الجديدة اللي عايز تستخدمها</p>
        <input dir="ltr" type="password" className={loginInput + " mb-2"} placeholder="كلمة السر الجديدة (6+ حروف)" value={pass}
          onChange={(e) => setPass(e.target.value)} />
        <input dir="ltr" type="password" className={loginInput} placeholder="تأكيد كلمة السر" value={pass2}
          onChange={(e) => setPass2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && save()} />
        {msg && <p className={"text-xs mt-2 text-center " + (msg.type === "err" ? "text-rose-600" : "text-emerald-600")}>{msg.text}</p>}
        <button disabled={busy} onClick={save}
          className="w-full mt-3 bg-brand-700 hover:bg-brand-800 text-white rounded-xl py-2.5 font-bold text-sm">
          {busy ? "لحظة…" : "حفظ كلمة السر"}
        </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- بوابة الدخول والتحميل ---------- */
function AuthGate() {
  const [session, setSession] = useState(undefined);
  const [boot, setBoot] = useState(null);
  const [patientBoot, setPatientBoot] = useState(null);
  const [err, setErr] = useState("");
  const [recovery, setRecovery] = useState(false);
  const [portal, setPortal] = useState("staff"); // staff | patient — قبل تسجيل الدخول بس

  useEffect(() => {
    // React اشتغل فعليًا ووصل هنا = التطبيق سليم، فأي رسالة خطأ قديمة ظاهرة على الشاشة بقت غير
    // صحيحة (ممكن تكون طلعت من مشكلة مؤقتة في تحميل ملف خارجي قبل ما الصفحة تكمل، والبرنامج عدّاها).
    var b = document.getElementById("errbox");
    if (b) { b.style.display = "none"; b.textContent = ""; }
    var boot0 = document.getElementById("boot");
    if (boot0) boot0.style.display = "none";
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((e, s) => {
      setSession(s || null);
      if (e === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setBoot(null); setPatientBoot(null); return; }
    let cancelled = false;
    (async () => {
      try {
        const { data: mem, error } = await sb.from("members").select("*").eq("auth_id", session.user.id).limit(1);
        if (error) throw error;
        if (mem && mem.length) {
          const m = mem[0];
          memberRef = { id: m.id, role: m.role, name: m.name, clinic_id: m.clinic_id, userId: session.user.id };
          const db0 = await loadAll(m);
          if (cancelled) return;
          saveOfflineSnapshot(session.user.id, memberRef, db0);
          subscribeRealtime();
          setBoot({
            db0,
            member: { id: m.id, role: m.role, name: m.name, clinic_id: m.clinic_id },
            pushDiff,
            subscribe: (cb) => { subCb = cb; return () => { subCb = null; }; },
            signOut: () => sb.auth.signOut().then(() => location.reload()),
            offline: false,
          });
          return;
        }
        const { data: pat, error: perr } = await sb.from("patients").select("*").eq("auth_id", session.user.id).limit(1);
        if (perr) throw perr;
        if (pat && pat.length) {
          if (cancelled) return;
          setPatientBoot({
            patient: pat[0],
            signOut: () => sb.auth.signOut().then(() => location.reload()),
          });
          return;
        }
        setErr("حسابك غير مرتبط بأي عيادة بعد.\nاطلب من صاحب العيادة إضافتك (كطبيب أو موظف) بنفس الإيميل ده، وبعدها اعمل خروج ودخول تاني.");
      } catch (e) {
        if (cancelled) return;
        const snap = loadOfflineSnapshot(session.user.id);
        if (snap) {
          memberRef = snap.member;
          setBoot({
            db0: snap.db0,
            member: { id: snap.member.id, role: snap.member.role, name: snap.member.name, clinic_id: snap.member.clinic_id },
            pushDiff,
            subscribe: (cb) => { subCb = cb; return () => { subCb = null; }; },
            signOut: () => sb.auth.signOut().then(() => location.reload()),
            offline: true,
            offlineSince: snap.savedAt,
          });
          return;
        }
        setErr("تعذر تحميل البيانات: " + (e.message || e));
      }
    })();
    return () => { cancelled = true; };
  }, [session]);

  const center = (child) => (
    <div dir="rtl" className="min-h-screen bg-[#FAF6EE] flex items-center justify-center p-4">{child}</div>
  );

  if (recovery) return <SetNewPassword onDone={() => { setRecovery(false); location.reload(); }} />;
  if (session === undefined) return center(<p className="text-brand-800 font-bold">جارِ التحقق…</p>);
  if (!session) return portal === "patient" ? <PatientAuth onStaff={() => setPortal("staff")} /> : <LoginSupa onPatient={() => setPortal("patient")} />;
  if (err) return center(
    <div className="bg-white rounded-3xl p-6 max-w-sm text-center shadow-xl">
      <p className="text-sm text-slate-700 whitespace-pre-wrap">{err}</p>
      <button onClick={() => sb.auth.signOut().then(() => location.reload())}
        className="mt-4 bg-brand-700 text-white rounded-xl px-5 py-2 text-sm font-bold">خروج</button>
    </div>
  );
  if (patientBoot) return <PatientApp boot={patientBoot} />;
  if (!boot) return center(<p className="text-brand-800 font-bold">🦷 جارِ تحميل بيانات العيادة…</p>);
  return <ClinicApp boot={boot} />;
}

/* ---------- بوابة المريض ---------- */
async function loadPatientData(patientId) {
  const { data: raw, error } = await sb.from("appointments").select("*").eq("patient_id", patientId).order("date", { ascending: false });
  if (error) throw error;
  const appts = (raw || []).map(COLS.appointments.from);
  const docIds = [...new Set(appts.map((a) => a.doctorId).filter(Boolean))];
  const branchIds = [...new Set(appts.map((a) => a.branchId).filter(Boolean))];
  const [docsRes, branchesRes] = await Promise.all([
    docIds.length ? sb.from("members").select("id,name,specialty").in("id", docIds) : Promise.resolve({ data: [] }),
    branchIds.length ? sb.from("clinic_branches").select("id,name,address").in("id", branchIds) : Promise.resolve({ data: [] }),
  ]);
  return { appointments: appts, doctors: docsRes.data || [], branches: branchesRes.data || [] };
}

  return (
    <div dir="rtl" className="min-h-screen bg-[#FAF6EE] text-slate-800" style={{ fontFamily: "'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif" }}>

              </svg>

            <div>
              <h1 className="font-brand text-lg leading-none">أهلاً {patient.name}</h1>
              <p className="text-[#D7C6C0] text-xs mt-1">حسابك في عيادتي</p>

        )}

  );

/* ============ نظام إدارة العيادات v3 — النسخة المنافسة ============
   إضافات هذه النسخة:
   🦷 مخطط أسنان تفاعلي (Dental Chart) لكل مريض
   ⭐ نظام نقاط ولاء (كسب واستبدال عند الدفع)
   📝 سجل تدقيق كامل (من فعل ماذا ومتى) — للمالك فقط
   📊 تقارير تحليلية: دخل الأطباء، أعلى الخدمات، ديموغرافيا المرضى
================================================================== */

const todayStr = () => new Date().toLocaleDateString("en-CA");
const nowTime = () => new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; const v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); });
const fmt = (n) => Number(n || 0).toLocaleString("ar-EG") + " ج.م";

/* نقاط الولاء: 5 نقاط لكل 100 ج.م مدفوعة · النقطة = 1 ج.م عند الاستبدال */
const POINTS_PER_100 = 5;

/* طرق الدفع المتاحة عند تسجيل تحصيلة، والعملات الشائعة لو المريض دفع بعملة غير الجنيه */
const PAYMENT_METHODS = ["كاش", "فيزا", "انستاباي", "محفظة إلكترونية", "تحويل بنكي", "أخرى"];
const CURRENCIES = ["EGP", "USD", "EUR", "SAR", "AED", "GBP"];

const waLink = (phone, msg) => {
  let p = (phone || "").replace(/[^0-9]/g, "");
  if (p.startsWith("01") && p.length === 11) p = "2" + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(msg)}`;
};

const contractSplit = (price, contract) => {
  if (!contract) return { net: price, patientShare: price, entityShare: 0 };
  const net = Math.round(price * (1 - (contract.discount || 0) / 100));
  const patientShare = Math.round((net * (contract.patientPct ?? 100)) / 100);
  return { net, patientShare, entityShare: net - patientShare };
};

/* المساعد الذكي: يحوّل ملاحظة حرة لمسودة إجراءات منظمة عبر Edge Function مؤمّنة (الذكاء الاصطناعي لا يكتب في القاعدة مباشرة) */
async function callAiAssistant(note, context) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPA_URL}/functions/v1/ai-assistant`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: SUPA_KEY },
    body: JSON.stringify({ note, context }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(json.error || `تعذر الاتصال بالمساعد الذكي (${res.status})`);
    err.usage = json.usage || null;
    throw err;
  }
  return json;
}

/* حسابات فرع معين: التحصيلات (من دفعات مربوطة بيه صراحةً أو عبر موعد تابع له) − مصاريف مربوطة بيه صراحةً */
const branchFinance = (db, branchId, fromDate) => {
  const apptBranchOf = new Map(db.appointments.map((a) => [a.id, a.branchId]));
  const pays = db.payments.filter((p) => (fromDate ? p.date >= fromDate : true) && (p.branchId ? p.branchId === branchId : apptBranchOf.get(p.apptId) === branchId));
  const exps = db.expenses.filter((e) => (fromDate ? e.date >= fromDate : true) && e.branchId === branchId);
  const revenue = pays.reduce((s, p) => s + p.amount, 0);
  const expenses = exps.reduce((s, e) => s + e.amount, 0);
  return { revenue, expenses, net: revenue - expenses, payments: pays, expensesList: exps };
};

/* المسافة بين نقطتين على الكرة الأرضية بالمتر (Haversine) */
const distanceMeters = (lat1, lon1, lat2, lon2) => {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};
const getCurrentLocation = () => new Promise((resolve, reject) => {
  if (!navigator.geolocation) { reject(new Error("الجهاز ده مايدعمش تحديد الموقع")); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => resolve(pos.coords),
    (err) => reject(new Error(err.code === 1 ? "لازم توافق على إذن الموقع من المتصفح" : "تعذر تحديد الموقع")),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
});
/* يتحقق من موقع الموظف مقابل فرعه قبل تسجيل حضور/انصراف — بيرجع بيانات الموقع أو null لو المستخدم لغى العملية */
async function verifyAttendanceLocation(branch) {
  if (!branch || branch.latitude == null || branch.longitude == null) {
    return { method: "manual", branchId: branch ? branch.id : "" };
  }
  try {
    const coords = await getCurrentLocation();
    const distance = distanceMeters(coords.latitude, coords.longitude, branch.latitude, branch.longitude);
    if (distance <= (branch.radius || 75)) {
      return { method: "gps", branchId: branch.id, lat: coords.latitude, lng: coords.longitude, accuracy: coords.accuracy, distance };
    }
    const reason = window.prompt(`أنت على بعد ${Math.round(distance)} متر من "${branch.name}" (المسموح ${branch.radius || 75} متر).\nاكتب سبب تسجيل الحضور من بره النطاق ده:`);
    if (!reason || reason.trim().length < 3) return null;
    return { method: "manual", branchId: branch.id, lat: coords.latitude, lng: coords.longitude, accuracy: coords.accuracy, distance, manualOverride: true, overrideReason: reason.trim() };
  } catch (e) {
    const reason = window.prompt(`تعذر تحديد موقعك (${e.message}).\nاكتب سبب تسجيل الحضور يدويًا:`);
    if (!reason || reason.trim().length < 3) return null;
    return { method: "manual", branchId: branch.id, manualOverride: true, overrideReason: reason.trim() };
  }
}

/* تكلفة الخدمة الحقيقية: مستهلكات + نصيب من المصاريف الثابتة */
const monthlyOverheadPerCase = (db, monthKey) => {
  const monthOverhead = db.overheadCosts.filter((c) => c.month === monthKey).reduce((s, c) => s + c.amount, 0);
  return db.overheadSettings.expectedCases > 0 ? monthOverhead / db.overheadSettings.expectedCases : 0;
};
const computeServiceCost = (db, service, overheadPerCase) => {
  const recipe = db.serviceRecipe.filter((r) => r.serviceId === service.id);
  const consumablesCost = recipe.reduce((sum, r) => {
    const item = db.inventory.find((i) => i.id === r.itemId);
    const qtyWithWaste = r.qty * (1 + (r.wastagePct || 0) / 100);
    return sum + qtyWithWaste * (item ? item.cost : 0);
  }, 0);
  const totalCost = consumablesCost + overheadPerCase;
  const margin = service.price - totalCost;
  const marginPct = service.price > 0 ? Math.round((margin / service.price) * 100) : 0;
  return { consumablesCost, overheadPerCase, totalCost, margin, marginPct };
};
/* يعيد ضبط سعر الخدمات اللي مفعّل عليها "تسعير تلقائي" بحيث يحافظ على هامش الربح المستهدف بعد تغيّر تكلفة المستهلكات */
const recomputeAutoPricedServices = (d) => {
  const overheadPerCase = monthlyOverheadPerCase(d, todayStr().slice(0, 7));
  const target = d.overheadSettings.targetMarginPct || 0;
  d.services.forEach((s) => {
    if (!s.autoPricing) return;
    const { totalCost } = computeServiceCost(d, s, overheadPerCase);
    const newPrice = target < 100 ? totalCost / (1 - target / 100) : totalCost;
    s.price = Math.max(0, Math.round(newPrice));
  });
};
/* رصيد مورد: إجمالي الفواتير − إجمالي المدفوع = الدين المتبقي */
const supplierBalance = (db, supplierId) => {
  const invoices = db.purchaseInvoices.filter((i) => i.supplierId === supplierId);
  const total = invoices.reduce((s, i) => s + i.total, 0);
  const paid = invoices.reduce((s, i) => s + i.paidAmount, 0);
  return { total, paid, owed: Math.max(0, total - paid) };
};
/* سداد دين مورد: بيقفل أقدم الفواتير المفتوحة أولاً (FIFO) ويسجل مصروف فعلي وقت خروج الكاش */
const paySupplierDebt = (d, supplierId, amount, supplierName) => {
  let remaining = amount;
  const open = d.purchaseInvoices.filter((i) => i.supplierId === supplierId && i.paidAmount < i.total).sort((a, b) => a.date.localeCompare(b.date));
  for (const inv of open) {
    if (remaining <= 0) break;
    const due = inv.total - inv.paidAmount;
    const pay = Math.min(due, remaining);
    inv.paidAmount += pay;
    remaining -= pay;
  }
  const applied = amount - remaining;
  if (applied > 0) {
    d.supplierPayments.push({ id: uid(), supplierId, invoiceId: "", amount: applied, date: todayStr(), notes: "" });
    d.expenses.push({ id: uid(), date: todayStr(), item: `سداد دين مورد: ${supplierName}`, category: "مخزن", amount: applied });
  }
  return applied;
};
