        <Btn className="w-full" tone="rose" onClick={() => {
          if (reason.trim().length < 3) { alert("لازم تكتب سبباً واضحاً (3 حروف على الأقل)"); return; }
          audit(d.apply, { area: d.area, act: d.act, item: d.item, before: d.before, after: d.after, reason: reason.trim() });
          close();
        }}>تأكيد وتسجيل السبب</Btn>
        <Btn className="w-full" tone="ghost" onClick={close}>إلغاء</Btn>
      </div>
    </Modal>
  );
}

/* ---------- حركة مخزن بسبب ---------- */
function StockMoveModal({ modal, setModal, audit }) {
  const { item, delta } = modal.data;
  const isOut = delta < 0;
  const [qty, setQty] = useState(1);
  const [reason, setReason] = useState("");
  const close = () => setModal(null);
  const n = Math.max(1, Number(qty) || 1);
  const newQty = Math.max(0, item.qty + (isOut ? -n : n));
  return (
    <Modal title={(isOut ? "صرف من" : "إضافة إلى") + " " + item.name} onClose={close}>
      <div className="space-y-3">
        <p className="text-sm text-slate-600">الرصيد الحالي: <b>{item.qty} {item.unit}</b> ← بعد الحركة: <b className={isOut ? "text-rose-700" : "text-emerald-700"}>{newQty} {item.unit}</b></p>
        <Field label={"الكمية (" + item.unit + ")"}>
          <input type="number" min="1" className={inputCls} value={qty} onChange={(e) => setQty(e.target.value)} />
        </Field>
        <Field label={isOut ? "سبب الصرف (إجباري)" : "مصدر الإضافة (إجباري)"}>
          <input className={inputCls} placeholder={isOut ? "استخدام في حالة، تلف، مرتجع…" : "شراء من مورد، مرتجع…"} value={reason} onChange={(e) => setReason(e.target.value)} />
        </Field>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[11px] text-amber-800">
          🚨 كل حركة مخزن تُسجَّل في تقرير الرقابة باسمك.
        </div>
        <Btn className="w-full" tone={isOut ? "rose" : "emerald"} onClick={() => {
          if (reason.trim().length < 3) { alert("لازم تكتب السبب"); return; }
          audit((d) => { const x = d.inventory.find((y) => y.id === item.id); x.qty = newQty; return d; },
            { area: "المخزن", act: isOut ? "صرف كمية" : "إضافة كمية", item: item.name,
              before: item.qty + " " + item.unit, after: newQty + " " + item.unit, reason: reason.trim() });
          close();
        }}>تأكيد</Btn>
      </div>
    </Modal>
  );
}

/* ---------- تقرير الرقابة (المالك فقط) ---------- */
function Watchtower({ db }) {
  const [area, setArea] = useState("");
  const flags = (db.auditFlags || []).filter((x) => !area || x.area === area);
  const areas = [...new Set((db.auditFlags || []).map((x) => x.area))];
  const byUser = {};
  (db.auditFlags || []).forEach((x) => { byUser[x.user] = (byUser[x.user] || 0) + 1; });
  const tone = (a) => a.indexOf("حذف") === 0 ? "bg-rose-50 border-rose-200" : a.indexOf("تعديل") === 0 ? "bg-amber-50 border-amber-200" : "bg-slate-50 border-slate-200";
  return (
    <React.Fragment>
      <Card className="p-4">
        <h2 className="font-bold text-teal-900 mb-1">🚨 تقرير الرقابة</h2>
        <p className="text-xs text-slate-500 mb-3">كل تعديل أو حذف في الأسعار أو المخزن أو الماليات — باسم منفّذه وسببه. يراه صاحب العيادة فقط.</p>
        <div className="grid grid-cols-2 gap-2">
          {Object.entries(byUser).map(([u, c]) => (
            <div key={u} className="bg-slate-50 rounded-xl p-2.5 text-xs">
              <p className="font-semibold truncate">{u}</p>
              <p className="text-slate-500">{c} عملية</p>
            </div>
          ))}
          {Object.keys(byUser).length === 0 && <p className="text-xs text-slate-400 col-span-2 text-center py-2">لا توجد عمليات مسجلة بعد</p>}
        </div>
      </Card>

      {areas.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={() => setArea("")} className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${area === "" ? "bg-teal-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>الكل</button>
          {areas.map((a) => (
            <button key={a} onClick={() => setArea(a)} className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${area === a ? "bg-teal-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{a}</button>
          ))}
        </div>
      )}

      <Card className="p-4">
        {flags.length === 0 ? <Empty text="لا توجد عمليات مسجلة" /> : (
          <div className="space-y-2">
            {flags.map((x) => (
              <div key={x.id} className={`rounded-xl border p-3 ${tone(x.act)}`}>
                <div className="flex justify-between items-start gap-2">
                  <div className="min-w-0">
                    <p className="font-bold text-sm">{x.act} — {x.item}</p>
                    <p className="text-xs text-slate-600 mt-0.5">
                      {x.before && <span>من <b>{x.before}</b> </span>}
                      {x.after && <span>إلى <b>{x.after}</b></span>}
                    </p>
                    <p className="text-xs text-slate-700 mt-1 bg-white/70 rounded-lg px-2 py-1">📝 السبب: {x.reason || "—"}</p>
                  </div>
                  <div className="text-left shrink-0">
                    <p className="text-[10px] text-slate-400">{x.date}</p>
                    <p className="text-[10px] text-slate-400">{x.time}</p>
                  </div>
                </div>
                <p className="text-[11px] font-semibold text-teal-800 mt-1.5">👤 {x.user} · {x.area}</p>
              </div>
            ))}
          </div>
        )}
      </Card>
    </React.Fragment>
  );
}

/* ---------- حضوري (للموظف) ---------- */
function MyAttendance({ db, h, update }) {
  const t = todayStr();
  const e = h.myEmp;
  if (!e) return null;
  const r = db.attendance.find((x) => x.empId === e.id && x.date === t);
  const log = db.attendance.filter((x) => x.empId === e.id).slice(-15).reverse();
  return (
    <React.Fragment>
      <Card className="p-4 text-center">
        <p className="font-bold text-teal-900 mb-1">{e.name} — {e.role}</p>
        <p className="text-xs text-slate-500 mb-3">{t}</p>
        {!r ? (
          <Btn tone="emerald" onClick={() => update((d) => { d.attendance.push({ id: uid(), empId: e.id, date: t, in: nowTime(), out: null }); return d; }, "تسجيل حضور " + e.name)}>✋ تسجيل حضوري الآن</Btn>
        ) : !r.out ? (
          <React.Fragment>
            <p className="text-sm text-emerald-600 mb-2">حضرت الساعة {r.in}</p>
            <Btn tone="rose" onClick={() => update((d) => { const x = d.attendance.find((y) => y.empId === e.id && y.date === t && !y.out); if (x) x.out = nowTime(); return d; }, "تسجيل انصراف " + e.name)}>🏃 تسجيل انصرافي</Btn>
          </React.Fragment>
        ) : (
          <p className="text-sm text-slate-500">✓ يومك اكتمل: حضور {r.in} — انصراف {r.out}</p>
        )}
      </Card>
      <Card className="p-4">
        <h3 className="font-bold text-teal-900 mb-3">سجل حضوري</h3>
        {log.length === 0 ? <Empty text="لا توجد سجلات بعد" /> : (
          <div className="space-y-1.5 text-sm">
            {log.map((x) => (
              <div key={x.id} className="flex justify-between border-b border-slate-100 pb-1.5">
                <span>{x.date}</span>
                <span className="text-xs text-slate-500">{x.in}{x.out ? " ← " + x.out : " (لم تنصرف)"}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </React.Fragment>
  );
}

/* ---------- النوافذ ---------- */
function Modals({ modal, setModal, db, update, h, audit }) {
  /* نافذة السبب الإجباري لأي حذف/تعديل حسّاس */
  if (modal.type === "reason") return <ReasonModal modal={modal} setModal={setModal} audit={audit} />;
  if (modal.type === "stockMove") return <StockMoveModal modal={modal} setModal={setModal} audit={audit} />;
  const [f, setF] = useState(modal.data && modal.data.edit ? { ...modal.data.edit } : {});
  const edit = modal.data && modal.data.edit;
  const close = () => setModal(null);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  if (modal.type === "tooth") {
    const { pid, tooth } = modal.data;
    const p = db.patients.find((x) => x.id === pid);
    const cur = p.teeth?.[tooth] || { state: "سليم", note: "" };
    return (
      <Modal title={`🦷 السنّة رقم ${tooth} — ${p.name}`} onClose={close}>
        <div className="space-y-3">
          <Field label="الحالة">
            <div className="grid grid-cols-4 gap-1.5">
              {Object.entries(TOOTH_STATES).map(([name, cls]) => (
                <button key={name} onClick={() => setF({ ...f, state: name })}
                  className={`text-xs py-2 rounded-lg border-2 font-semibold ${cls} ${(f.state || cur.state) === name ? "ring-2 ring-teal-600" : ""}`}>
                  {name}
                </button>
              ))}
            </div>
          </Field>
          <Field label="ملاحظة"><input className={inputCls} value={f.note ?? cur.note} onChange={set("note")} /></Field>
          <Btn className="w-full" onClick={() => {
            const state = f.state || cur.state;
            update((d) => {
              const pt = d.patients.find((x) => x.id === pid);
              if (!pt.teeth) pt.teeth = {};
              pt.teeth[tooth] = { state, note: f.note ?? cur.note ?? "" };
              return d;
            }, `تحديث السنّة ${tooth} لـ${p.name} → ${state}`);
            close();
          }}>حفظ</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "appt") {
    const patient = db.patients.find((p) => p.id === f.patientId);
    const autoContract = f.contractId !== undefined ? f.contractId : (patient?.contractId || "");
    const contract = db.contracts.find((c) => c.id === autoContract);
    const split = contractSplit(Number(f.price || 0), contract);
    return (
      <Modal title="حجز موعد جديد" onClose={close}>
        <div className="space-y-3">
          <Field label="المريض">
            <select className={inputCls} value={f.patientId || ""} onChange={set("patientId")}>
              <option value="">— اختر —</option>
              {db.patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="الطبيب">
            <select className={inputCls} value={f.doctorId || (h.isOwner ? "" : h.myDocId)} onChange={set("doctorId")} disabled={!h.isOwner}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="التاريخ"><input type="date" className={inputCls} value={f.date || modal.data.date} onChange={set("date")} /></Field>
            <Field label="الوقت"><input type="time" className={inputCls} value={f.time || ""} onChange={set("time")} /></Field>
          </div>
          <Field label="الخدمة"><input className={inputCls} placeholder="كشف، حشو، جلسة…" value={f.service || ""} onChange={set("service")} /></Field>
          <Field label="السعر (ج.م)"><input type="number" className={inputCls} value={f.price || ""} onChange={set("price")} /></Field>
          <Field label="تعاقد / نقابة (اختياري)">
            <select className={inputCls} value={autoContract} onChange={set("contractId")}>
              <option value="">بدون — خاص</option>
              {db.contracts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          {contract && Number(f.price) > 0 && (
            <div className="bg-violet-50 rounded-xl p-3 text-xs text-violet-800 space-y-1">
              <p>الصافي بعد خصم {contract.discount}%: <b>{fmt(split.net)}</b></p>
              <p>يدفع المريض: <b>{fmt(split.patientShare)}</b> · على الجهة: <b>{fmt(split.entityShare)}</b></p>
            </div>
          )}
          <Btn className="w-full" onClick={() => {
            const doctorId = f.doctorId || (h.isOwner ? "" : h.myDocId);
            if (!f.patientId || !doctorId || !f.time) return;
            update((d) => {
              d.appointments.push({
                id: uid(), patientId: f.patientId, doctorId, date: f.date || modal.data.date, time: f.time,
                service: f.service || "كشف", price: Number(f.price || 0), contractId: autoContract || "",
                patientShare: split.patientShare, entityShare: split.entityShare, entityPaid: false, paid: 0, status: "محجوز",
              });
              return d;
            }, `حجز موعد لـ${h.pName(f.patientId)} — ${f.service || "كشف"}`);
            close();
          }}>حفظ الحجز</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "collect") {
    const a = modal.data;
    const p = db.patients.find((x) => x.id === a.patientId);
    const share = a.patientShare ?? a.price;
    const due = Math.max(0, share - a.paid);
    const usePts = f.usePts === "1";
    const redeem = usePts ? Math.min(p.points || 0, due) : 0;
    const cashDue = due - redeem;
    return (
      <Modal title={`تحصيل من ${p.name}`} onClose={close}>
        <div className="space-y-3">
          <p className="text-sm text-slate-600">المتبقي: <b className="text-amber-700">{fmt(due)}</b></p>
          {(p.points || 0) > 0 && (
            <label className="flex items-center gap-2 bg-yellow-50 rounded-xl p-3 text-sm cursor-pointer">
              <input type="checkbox" checked={usePts} onChange={(e) => setF({ ...f, usePts: e.target.checked ? "1" : "0", amount: undefined })} />
              <span>⭐ استبدال نقاط الولاء ({p.points} نقطة = خصم حتى {fmt(Math.min(p.points, due))})</span>
            </label>
          )}
          {usePts && <p className="text-xs text-emerald-700">خصم النقاط: −{fmt(redeem)} · المطلوب نقداً: <b>{fmt(cashDue)}</b></p>}
          <Field label="المبلغ المحصَّل نقداً">
            <input type="number" className={inputCls} value={f.amount ?? cashDue} onChange={set("amount")} />
          </Field>
          <Btn className="w-full" tone="emerald" onClick={() => {
            const cash = Math.min(Number(f.amount ?? cashDue), cashDue);
            if (cash < 0 || (cash === 0 && redeem === 0)) return;
            const earned = Math.floor(cash / 100) * POINTS_PER_100;
            update((d) => {
              const appt = d.appointments.find((x) => x.id === a.id);
              appt.paid += cash + redeem;
              const pt = d.patients.find((x) => x.id === a.patientId);
              pt.points = (pt.points || 0) - redeem + earned;
              if (cash > 0)
                d.payments.push({ id: uid(), date: todayStr(), patientId: a.patientId, doctorId: a.doctorId, apptId: a.id, amount: cash, note: a.service, source: "مريض" });
              return d;
            }, `تحصيل ${fmt(cash)} من ${p.name}${redeem ? ` + استبدال ${redeem} نقطة` : ""}${earned ? ` (كسب ${earned} نقطة)` : ""}`);
            close();
          }}>تأكيد التحصيل</Btn>
          <p className="text-[10px] text-slate-400">يكسب المريض {POINTS_PER_100} نقاط تلقائياً عن كل 100 ج.م مدفوعة نقداً.</p>
        </div>
      </Modal>
    );
  }

  if (modal.type === "patient") {
    return (
      <Modal title={edit ? "تعديل بيانات مريض" : "إضافة مريض"} onClose={close}>
        <div className="space-y-3">
          <Field label="الاسم"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <Field label="رقم الموبايل (واتساب)"><input dir="ltr" className={inputCls} placeholder="01xxxxxxxxx" value={f.phone || ""} onChange={set("phone")} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="النوع">
              <select className={inputCls} value={f.gender || ""} onChange={set("gender")}>
                <option value="">—</option><option>ذكر</option><option>أنثى</option>
              </select>
            </Field>
            <Field label="السن"><input type="number" className={inputCls} value={f.age || ""} onChange={set("age")} /></Field>
          </div>
          <Field label="تعاقد / نقابة">
            <select className={inputCls} value={f.contractId || ""} onChange={set("contractId")}>
              <option value="">بدون</option>
              {db.contracts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <Field label="ملاحظات طبية"><input className={inputCls} value={f.notes || ""} onChange={set("notes")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.patients.find((y) => y.id === edit.id);
                x.name = f.name; x.phone = f.phone || ""; x.notes = f.notes || ""; x.contractId = f.contractId || "";
                x.gender = f.gender || ""; x.age = Number(f.age || 0) || null;
              } else {
                d.patients.push({ id: uid(), name: f.name, phone: f.phone || "", notes: f.notes || "", contractId: f.contractId || "", gender: f.gender || "", age: Number(f.age || 0) || null, points: 0, teeth: {} });
              }
              return d;
            }, edit ? `تعديل بيانات المريض: ${f.name}` : `إضافة مريض جديد: ${f.name}`);
            close();
          }}>حفظ</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "record") {
    return (
      <Modal title="إضافة تحليل / أشعة / روشتة" onClose={close}>
        <div className="space-y-3">
          <Field label="النوع">
            <div className="grid grid-cols-4 gap-1.5">
              {["تحليل", "أشعة", "روشتة", "تقرير"].map((t) => (
                <button key={t} onClick={() => setF({ ...f, type: t })}
                  className={`text-xs py-2 rounded-lg border-2 font-semibold ${(f.type || "تحليل") === t ? "border-teal-600 bg-teal-50 text-teal-800" : "border-slate-200 text-slate-500"}`}>{t}</button>
              ))}
            </div>
          </Field>
          <Field label="العنوان"><input className={inputCls} placeholder="صورة دم كاملة، أشعة بانوراما، روشتة مضاد حيوي…" value={f.title || ""} onChange={set("title")} /></Field>
          <Field label="التفاصيل / النتيجة / محتوى الروشتة">
            <textarea rows="4" className={inputCls} placeholder={"مثال للروشتة:\nAugmentin 1g — قرص كل 12 ساعة لمدة 5 أيام\nBrufen 400 — عند اللزوم"} value={f.details || ""} onChange={set("details")} />
          </Field>
          <Field label="رابط مرفق (اختياري)"><input dir="ltr" className={inputCls} placeholder="رابط صورة الأشعة على جوجل درايف" value={f.link || ""} onChange={set("link")} /></Field>
          <Field label="الطبيب">
            <select className={inputCls} value={f.doctorId || (h.isOwner ? "" : h.myDocId)} onChange={set("doctorId")}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="التاريخ"><input type="date" className={inputCls} value={f.date || todayStr()} onChange={set("date")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.title) return;
            update((d) => {
              if (!d.records) d.records = [];
              d.records.push({ id: uid(), patientId: modal.data.patientId, doctorId: f.doctorId || h.myDocId || "", date: f.date || todayStr(), type: f.type || "تحليل", title: f.title, details: f.details || "", link: f.link || "" });
              return d;
            }, `إضافة ${f.type || "تحليل"} لـ${h.pName(modal.data.patientId)}: ${f.title}`);
            close();
          }}>حفظ</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "plan") {
    return (
      <Modal title="إضافة إجراء لخطة العلاج" onClose={close}>
        <div className="space-y-3">
          <Field label="التخصص"><input className={inputCls} placeholder="أسنان، جلدية…" value={f.specialty || ""} onChange={set("specialty")} /></Field>
          <Field label="الإجراء"><input className={inputCls} value={f.procedure || ""} onChange={set("procedure")} /></Field>
          <Field label="الطبيب المسؤول">
            <select className={inputCls} value={f.doctorId || (h.isOwner ? "" : h.myDocId)} onChange={set("doctorId")}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="السعر التقديري"><input type="number" className={inputCls} value={f.price || ""} onChange={set("price")} /></Field>
          <Field label="ملاحظات"><input className={inputCls} value={f.notes || ""} onChange={set("notes")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.procedure) return;
            update((d) => {
              d.plans.push({ id: uid(), patientId: modal.data.patientId, doctorId: f.doctorId || h.myDocId || "", specialty: f.specialty || "عام", procedure: f.procedure, price: Number(f.price || 0), status: "مقترح", notes: f.notes || "" });
              return d;
            }, `إضافة لخطة علاج ${h.pName(modal.data.patientId)}: ${f.procedure}`);
            close();
          }}>إضافة للخطة</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "contract") {
    return (
      <Modal title={edit ? "تعديل التعاقد" : "تعاقد جديد"} onClose={close}>
        <div className="space-y-3">
          <Field label="اسم الجهة / النقابة"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="خصم على الأسعار (%)"><input type="number" className={inputCls} value={f.discount || ""} onChange={set("discount")} /></Field>
            <Field label="يتحمل المريض (%)"><input type="number" className={inputCls} value={f.patientPct ?? ""} onChange={set("patientPct")} /></Field>
          </div>
          <p className="text-xs text-slate-500 bg-slate-50 rounded-xl p-2">يُخصم % من السعر أولاً، ثم يدفع المريض نسبته والباقي مطالبة على الجهة.</p>
          <Field label="شروط التعاقد"><input className={inputCls} value={f.terms || ""} onChange={set("terms")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.contracts.find((y) => y.id === edit.id);
                x.name = f.name; x.discount = Number(f.discount || 0); x.patientPct = Number(f.patientPct ?? 100); x.terms = f.terms || "";
              } else {
                d.contracts.push({ id: uid(), name: f.name, discount: Number(f.discount || 0), patientPct: Number(f.patientPct ?? 100), terms: f.terms || "", active: true });
              }
              return d;
            }, edit ? `تعديل تعاقد: ${f.name}` : `إضافة تعاقد: ${f.name}`);
            close();
          }}>حفظ التعاقد</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "lab") {
    return (
      <Modal title="إضافة حالة معمل" onClose={close}>
        <div className="space-y-3">
          <Field label="المريض">
            <select className={inputCls} value={f.patientId || ""} onChange={set("patientId")}>
              <option value="">— اختر —</option>
              {db.patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="الطبيب">
            <select className={inputCls} value={f.doctorId || ""} onChange={set("doctorId")}>
              <option value="">— اختر —</option>
              {db.doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </Field>
          <Field label="اسم المعمل"><input className={inputCls} value={f.labName || ""} onChange={set("labName")} /></Field>
          <Field label="الشغلانة"><input className={inputCls} value={f.work || ""} onChange={set("work")} /></Field>
          <Field label="التكلفة"><input type="number" className={inputCls} value={f.cost || ""} onChange={set("cost")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.patientId || !f.work) return;
            update((d) => { d.labCases.push({ id: uid(), patientId: f.patientId, doctorId: f.doctorId || "", labName: f.labName || "", work: f.work, cost: Number(f.cost || 0), dateSent: todayStr(), status: "بالمعمل", paidToLab: false }); return d; }, `إرسال حالة للمعمل: ${f.work}`);
            close();
          }}>حفظ الحالة</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "expense") {
    return (
      <Modal title="إضافة مصروف" onClose={close}>
        <div className="space-y-3">
          <Field label="البند"><input className={inputCls} value={f.item || ""} onChange={set("item")} /></Field>
          <Field label="التصنيف"><input className={inputCls} value={f.category || ""} onChange={set("category")} /></Field>
          <Field label="المبلغ"><input type="number" className={inputCls} value={f.amount || ""} onChange={set("amount")} /></Field>
          <Btn className="w-full" tone="rose" onClick={() => {
            if (!f.item || !f.amount) return;
            update((d) => { d.expenses.push({ id: uid(), date: todayStr(), item: f.item, category: f.category || "عام", amount: Number(f.amount) }); return d; }, `مصروف: ${f.item} — ${fmt(f.amount)}`);
            close();
          }}>حفظ المصروف</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "employee") {
    return (
      <Modal title={edit ? "تعديل بيانات الموظف" : "إضافة موظف"} onClose={close}>
        <div className="space-y-3">
          <Field label="الاسم"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <Field label="الوظيفة"><input className={inputCls} value={f.role || ""} onChange={set("role")} /></Field>
          <Field label="المرتب الشهري"><input type="number" className={inputCls} value={f.salary || ""} onChange={set("salary")} /></Field>
          <Field label="إيميل الموظف (فارغ = لا يمكنه الدخول)"><input dir="ltr" type="email" className={inputCls} placeholder="staff@example.com" value={f.email || ""} onChange={set("email")} /></Field>
          <Field label="صلاحيات الموظف — يحددها المالك فقط">
            <div className="grid grid-cols-2 gap-1.5 text-xs">
              {[["appts", "المواعيد والحجز"], ["collect", "التحصيل"], ["patients", "المرضى والشيتات"], ["inventory", "المخزن"]].map(([k, label]) => (
                <label key={k} className={`flex items-center gap-1.5 rounded-lg border p-2 cursor-pointer ${(f.perms || {})[k] ? "border-teal-600 bg-teal-50" : "border-slate-200"}`}>
                  <input type="checkbox" checked={!!(f.perms || {})[k]}
                    onChange={(ev) => setF({ ...f, perms: { ...(f.perms || {}), [k]: ev.target.checked } })} />
                  <span>{label}</span>
                </label>
              ))}
            </div>
          </Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.employees.find((y) => y.id === edit.id);
                x.name = f.name; x.role = f.role || ""; x.salary = Number(f.salary || 0);
                x.email = f.email || ""; x.perms = f.perms || {};
              } else {
                d.employees.push({ id: uid(), name: f.name, role: f.role || "", salary: Number(f.salary || 0), email: f.email || "", perms: f.perms || {} });
              }
              return d;
            }, edit ? `تعديل بيانات الموظف: ${f.name}` : `إضافة موظف: ${f.name}`);
            close();
          }}>حفظ</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "payrollTx") {
    const e = modal.data;
    return (
      <Modal title={`حركة مرتب — ${e.name}`} onClose={close}>
        <div className="space-y-3">
          <Field label="النوع">
            <select className={inputCls} value={f.type || "مكافأة"} onChange={set("type")}>
              <option>مكافأة</option><option>خصم</option><option>سلفة</option>
            </select>
          </Field>
          <Field label="المبلغ"><input type="number" className={inputCls} value={f.amount || ""} onChange={set("amount")} /></Field>
          <Field label="ملاحظة"><input className={inputCls} value={f.note || ""} onChange={set("note")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.amount) return;
            update((d) => { d.payrollTx.push({ id: uid(), empId: e.id, date: todayStr(), type: f.type || "مكافأة", amount: Number(f.amount), note: f.note || "", settled: false }); return d; }, `${f.type || "مكافأة"} ${fmt(f.amount)} لـ${e.name}`);
            close();
          }}>حفظ الحركة</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "item") {
    return (
      <Modal title={edit ? "تعديل صنف" : "إضافة صنف للمخزن"} onClose={close}>
        <div className="space-y-3">
          <Field label="اسم الصنف"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <div className="grid grid-cols-3 gap-3">
            <Field label="الوحدة"><input className={inputCls} value={f.unit || ""} onChange={set("unit")} /></Field>
            <Field label="الكمية"><input type="number" className={inputCls} value={f.qty || ""} onChange={set("qty")} /></Field>
            <Field label="الحد الأدنى"><input type="number" className={inputCls} value={f.min || ""} onChange={set("min")} /></Field>
          </div>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.inventory.find((y) => y.id === edit.id);
                x.name = f.name; x.unit = f.unit || "وحدة"; x.qty = Number(f.qty || 0); x.min = Number(f.min || 0);
              } else {
                d.inventory.push({ id: uid(), name: f.name, unit: f.unit || "وحدة", qty: Number(f.qty || 0), min: Number(f.min || 0) });
              }
              return d;
            }, edit ? `تعديل صنف: ${f.name}` : `إضافة صنف للمخزن: ${f.name}`);
            close();
          }}>حفظ الصنف</Btn>
        </div>
      </Modal>
    );
  }

  if (modal.type === "doctor") {
    return (
      <Modal title={edit ? "تعديل بيانات الطبيب" : "إضافة طبيب (حساب منفصل)"} onClose={close}>
        <div className="space-y-3">
          <Field label="الاسم"><input className={inputCls} value={f.name || ""} onChange={set("name")} /></Field>
          <Field label="التخصص"><input className={inputCls} value={f.specialty || ""} onChange={set("specialty")} /></Field>
          <Field label="نسبة الطبيب (%)"><input type="number" className={inputCls} value={f.commission || ""} onChange={set("commission")} /></Field>
          <Field label="إيميل الطبيب (هيسجل بيه دخوله)"><input dir="ltr" type="email" className={inputCls} placeholder="doctor@example.com" value={f.email || ""} onChange={set("email")} /></Field>
          <Btn className="w-full" onClick={() => {
            if (!f.name) return;
            update((d) => {
              if (edit) {
                const x = d.doctors.find((y) => y.id === edit.id);
                x.name = f.name; x.specialty = f.specialty || ""; x.commission = Number(f.commission || 0); x.email = f.email || x.email;
              } else {
                d.doctors.push({ id: uid(), name: f.name, specialty: f.specialty || "", commission: Number(f.commission || 0), email: f.email || "" });
              }
              return d;
            }, edit ? `تعديل بيانات الطبيب: ${f.name}` : `إنشاء حساب طبيب: ${f.name}`);
            close();
          }}>{edit ? "حفظ التعديلات" : "إنشاء الحساب"}</Btn>
        </div>
      </Modal>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
